<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планета — касса</title>
<style>
  :root{--ink:#14213d;--ink-2:#22305a;--paper:#fff;--ground:#eef1f6;--line:#d9dee8;--text:#1b2333;--mute:#66708a;--blue:#1f5eff;--blue-soft:#e6edff;--green:#1c7c4a;--green-soft:#e3f3ea;--red:#c62828;--red-soft:#fbe7e7;--amber:#b7791f;--amber-soft:#fdf2dc;--radius:10px}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%}
  body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--text);background:var(--ground)}
  button{font:inherit;cursor:pointer} input,select{font:inherit}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  #login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px}
  #login h1{margin:0 0 4px;font-size:20px} #login p{color:var(--mute);margin:0 0 14px}
  #login input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
  #app{display:none;grid-template-columns:232px 1fr;min-height:100vh}
  .rail{background:var(--ink);color:#dfe5f5;display:flex;flex-direction:column;padding:18px 14px;gap:14px;position:sticky;top:0;height:100vh}
  .brand b{display:block;font-size:16px;letter-spacing:.06em;color:#fff} .brand span{font-size:11px;color:#a8b3d6}
  nav{display:flex;flex-direction:column;gap:2px} nav .grp{font-size:11px;color:#8e9bc4;padding:10px 10px 4px}
  nav button{background:transparent;color:#dfe5f5;border:0;text-align:left;padding:8px 10px;border-radius:7px;display:flex;justify-content:space-between;align-items:center}
  nav button.on{background:var(--blue);color:#fff} nav .pill{background:#ff8f8f;color:#3a0000;font-size:11px;border-radius:99px;padding:0 7px;font-weight:600}
  .rail-foot{margin-top:auto;font-size:11px;color:#8e9bc4}
  .rail-foot button{background:transparent;border:1px solid #3b4a7a;color:#c9d2ee;padding:5px 9px;border-radius:7px;margin-top:8px}
  main{padding:22px 28px 60px;max-width:1200px}
  .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px} .top h1{font-size:22px;margin:0} .top .who{color:var(--mute)}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px} .card h2{font-size:15px;margin:0 0 10px} .lead{color:var(--mute);margin:0 0 10px}
  table{width:100%;border-collapse:collapse} th{font-weight:600;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:12.5px} td{padding:9px 8px;border-bottom:1px solid #eef1f6;vertical-align:middle} tr:last-child td{border-bottom:0}
  .b{font-weight:600} .mute{color:var(--mute)}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 12px;border-radius:8px} .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff} .btn.primary:disabled{background:#a9bcf5;border-color:#a9bcf5;cursor:not-allowed} .btn.danger{color:var(--red);border-color:#f1b8b8} .btn.small{padding:4px 9px;font-size:12.5px}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600} .tag.ok{background:var(--green-soft);color:var(--green)} .tag.warn{background:var(--amber-soft);color:var(--amber)} .tag.bad{background:var(--red-soft);color:var(--red)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .recon{display:grid;grid-template-columns:auto 1fr 1fr 1fr 1fr auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
  .recon>div{padding:14px 18px;border-right:1px solid var(--line)} .recon>div:last-child{border-right:0} .recon .lbl{font-size:12px;color:var(--mute)} .recon .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .recon .state{display:grid;place-items:center;min-width:150px;font-weight:700;color:#fff} .recon .state.ok{background:var(--green)} .recon .state.bad{background:var(--red)} .recon .day{background:var(--ink);color:#fff;display:grid;place-items:center;min-width:110px} .recon .day b{font-size:18px}
  .accept{display:grid;grid-template-columns:300px 1fr;gap:16px}
  .receipt{border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative} .receipt::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,var(--blue) 0 10px,transparent 10px 16px);border-radius:10px 10px 0 0}
  .receipt .sum{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:8px 0 4px} .receipt label{display:block;font-size:12px;color:var(--mute);margin:8px 0 3px} .receipt input,.receipt select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px}
  .alloc input{width:110px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;text-align:right} .alloc input.over{border-color:var(--red);background:var(--red-soft)}
  .total{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:12px 8px;border-top:2px solid var(--ink);margin-top:6px} .total .big{font-size:18px;font-weight:700}
  .note{padding:10px 12px;border-radius:8px;background:var(--amber-soft);color:#6b4a0f;margin-top:10px} .note.ok{background:var(--green-soft);color:var(--green)} .note.bad{background:var(--red-soft);color:var(--red)}
  #modal{position:fixed;inset:0;background:rgba(20,33,61,.45);display:none;place-items:center;z-index:10} #modal.show{display:grid}
  .box{background:#fff;border-radius:12px;padding:20px 22px;width:min(560px,92vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)} .box.wide{width:min(980px,94vw)} .box h3{margin:0 0 8px;font-size:17px}
  .box label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 4px} .box input,.box select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px} .box .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:20;max-width:80vw} #toast.show{opacity:1}
  .msg{white-space:pre-wrap;background:#f7f9fc;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px} .empty{color:var(--mute);padding:14px 0}
  .busy{opacity:.5;pointer-events:none}
  .bar{position:relative;height:10px;background:#eef1f6;border-radius:99px;overflow:hidden;min-width:120px}
  .bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:99px}
  .bar>i.g{background:var(--green)} .bar>i.a{background:var(--amber)}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .kpi>div{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
  .kpi .lbl{font-size:12px;color:var(--mute)} .kpi .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px} .kpi .sub{font-size:12px;color:var(--mute);margin-top:2px}
  .trow{cursor:pointer} .grow td{background:#f7f9fc;font-size:12.5px;color:#3b4560}
  .num-in{width:64px;padding:5px 7px;border:1px solid var(--line);border-radius:7px;text-align:right}
  /* встроенный режим: касса открыта внутри кабинета журнала (боковое меню и вход кабинета — снаружи) */
  body.embed{background:transparent}
  body.embed #app{grid-template-columns:1fr;min-height:0}
  body.embed .rail{display:none}
  body.embed main{padding:6px 4px 40px;max-width:none}
  body.embed .top{margin-bottom:12px} body.embed .top h1{font-size:18px}
  .kztabs{display:none;gap:4px;flex-wrap:wrap;align-items:center;margin:0 0 12px;padding:4px;background:#fff;border:1px solid var(--line);border-radius:10px}
  body.embed .kztabs{display:flex}
  .kztabs button{background:transparent;border:0;color:var(--ink-2);padding:7px 11px;border-radius:7px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
  .kztabs button.on{background:var(--blue);color:#fff}
  .kztabs .grp{font-size:11px;color:#8e9bc4;padding:0 2px 0 10px;text-transform:uppercase;letter-spacing:.04em}
  .kztabs .sp{flex:1}
  .kztabs .pill{background:#ff8f8f;color:#3a0000;font-size:11px;border-radius:99px;padding:0 7px;font-weight:600}
  .kztabs .mode{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mute);padding-right:4px}
  .kztabs .mode button{border:1px solid var(--line);font-size:12px;padding:4px 8px;font-weight:500;color:var(--text)}
  @media (max-width:900px){#app{grid-template-columns:1fr}.rail{position:static;height:auto}.accept,.grid2{grid-template-columns:1fr}.recon{grid-template-columns:1fr 1fr}}
  /* ============================================================
     МОБИЛЬНЫЙ РЕЖИМ · KassaPage v108 · телефон (ширина до 767 px)
     Работает и в отдельной вкладке (?page=kassa), и внутри
     кабинета журнала (встроенное окно). На компьютере не действует.
     ============================================================ */
  html{-webkit-text-size-adjust:100%}
  button,.btn{touch-action:manipulation}
  @media (max-width:767px){
    input,select{font-size:16px}                         /* iPhone не увеличивает экран при нажатии в поле */
    #login{margin:6vh 12px;padding:20px 16px}
    #login input{padding:12px}
    #login .btn{min-height:46px}
    /* отдельная вкладка: боковая панель превращается в верхнюю полосу с прокруткой */
    #app{grid-template-columns:minmax(0,1fr)}
    body.embed #app{grid-template-columns:minmax(0,1fr)}
    main{min-width:0;max-width:100%;overflow-x:clip}
    .card{min-width:0}
    #view{min-width:0}
    .rail{position:sticky;top:0;height:auto;padding:8px 10px;gap:8px;z-index:5;flex-direction:row;flex-wrap:wrap;align-items:center}
    .brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
    .brand b{font-size:14px}
    nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;flex:1 1 100%;order:3;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav .grp{display:none}
    nav button{white-space:nowrap;padding:8px 11px;min-height:38px;gap:6px}
    .rail-foot{margin-top:0;order:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .rail-foot #mode,.rail-foot #foot,.rail-foot br{display:none}
    .rail-foot button{margin-top:0;min-height:36px}
    main{padding:12px 10px 40px;max-width:none}
    body.embed main{padding:4px 2px 24px}
    .top{flex-wrap:wrap;gap:2px 10px;margin-bottom:12px}
    .top h1{font-size:19px}
    .top .who{font-size:12.5px}
    /* полоса разделов во встроенном режиме — прокручивается пальцем */
    .kztabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px;gap:2px}
    .kztabs::-webkit-scrollbar{display:none}
    .kztabs button{white-space:nowrap;min-height:38px;padding:7px 10px}
    .kztabs .grp{white-space:nowrap}
    .kztabs .sp{display:none}
    .kztabs .mode{flex:none;padding-left:8px}
    .kztabs .mode .tag{white-space:nowrap}
    /* карточки и таблицы: таблица прокручивается внутри карточки, столбцы не сжимаются */
    .card{padding:12px 12px}
    .card:has(table){overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
    table:has(tr>*:nth-child(4)){min-width:640px}
    table:has(tr>*:nth-child(7)){min-width:860px}
    td,th{padding-top:9px;padding-bottom:9px}
    .card>.row,.card h2+.row{flex-wrap:wrap}
    .row .btn,.btn{min-height:40px}
    .btn.small{min-height:34px}
    .recon{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    .recon>div{padding:12px 14px;border-right:0;border-bottom:1px solid var(--line)}
    .recon .day,.recon .state{min-width:0;grid-column:1 / -1}
    .recon .day{padding:10px}
    .recon .val{font-size:20px}
    .accept,.grid2{grid-template-columns:minmax(0,1fr)}
    .receipt .sum{font-size:26px}
    .receipt input,.receipt select{padding:10px}
    .alloc input{width:96px;padding:9px 8px}
    .kpi{grid-template-columns:1fr 1fr}
    /* диалоги: снизу, во всю ширину */
    #modal{place-items:end center}
    .box,.box.wide{width:100%;max-height:92vh;max-height:92dvh;border-radius:14px 14px 0 0;padding:16px 14px calc(14px + env(safe-area-inset-bottom,0px))}
    .box input,.box select{padding:11px 10px}
    .box .actions{position:sticky;bottom:0;background:#fff;padding-top:8px;flex-wrap:wrap}
    .box .actions .btn{flex:1 1 auto;min-height:44px}
    #toast{max-width:92vw;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  }
</style>
</head>
<body>
<div id="login"><h1>Касса «Планета»</h1><p>Пароль кассира или руководителя</p><input id="pw" type="password" placeholder="пароль" onkeydown="if(event.key==='Enter')login()"><button class="btn primary" style="width:100%" onclick="login()">Войти</button><div id="lerr" class="note bad" style="display:none"></div></div>
<div id="app">
  <aside class="rail"><div class="brand"><b>ПЛАНЕТА</b><span>касса</span></div><nav id="nav"></nav><div class="rail-foot"><div id="mode"></div><span id="foot"></span><br><button onclick="refresh()">Обновить</button> <button onclick="location.reload()">Выйти</button> <button id="jl" onclick="if(S&&S.journalUrl)window.open(S.journalUrl,'_blank')">Журнал</button></div></aside>
  <main><div id="kzTabs" class="kztabs"></div><header class="top"><h1 id="title"></h1><div class="who" id="who"></div></header><section id="view"><div class="empty">Загрузка…</div></section></main>
</div>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const money=n=>(Math.round(n)||0).toLocaleString('ru-RU').replace(/,/g,' ');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pw='', me=null, S=null, section='';
// ===== встроенный режим: касса внутри кабинета журнала =====
// Кабинет открывает эту страницу с ?embed=1 во встроенном окне, присылает код доступа сообщением
// planeta-kassa-login и переключает разделы сообщением planeta-kassa-go. Второй ввод кода не нужен.
let embed=false, hostWin=null, kzLoginGot=false, kzAnnN=0, kzAnnT=null;
function kzPost(m){try{if(hostWin){hostWin.postMessage(m,'*');return}}catch(e){}
  // кабинет — один из родительских кадров (страница кассы живёт внутри оболочки Apps Script): шлём всем вверх по цепочке
  try{let w=window,n=0;while(w.parent&&w.parent!==w&&n<6){w=w.parent;n++;try{w.postMessage(m,'*')}catch(e){}}}catch(e){}}
function enterEmbed(){if(embed)return;embed=true;document.body.classList.add('embed');$('login').style.display='none';kzAnnounce()}
function kzAnnounce(){clearTimeout(kzAnnT);if(kzLoginGot||kzAnnN>=20)return;kzAnnN++;kzPost({type:'planeta-kassa-ready'});kzAnnT=setTimeout(kzAnnounce,1500)}
function kzTabsRender(nav,newN){const nt=$('kzTabs');if(!nt||!embed)return;
  nt.innerHTML=nav.map(n=>n.g?'<span class="grp">'+n.g+'</span>':'<button class="'+(n.k===section?'on':'')+'" onclick="go(\''+n.k+'\')">'+n.t+(n.k==='inbox'&&newN?'<span class="pill">'+newN+'</span>':'')+'</button>').join('')
    +'<span class="sp"></span><span class="mode">'+(S.kassaOn?'<span class="tag ok">режим кассы включён</span>':'<span class="tag warn">режим кассы выключен</span>')
    +(me.role==='director'?'<button onclick="setMode('+(S.kassaOn?'false':'true')+')">'+(S.kassaOn?'выключить':'включить')+'</button>':'')
    +'<button onclick="refresh()" title="Обновить данные кассы">↻ Обновить</button></span>'}
function kzShowLogin(msg){$('lerr').textContent=msg||'';$('lerr').style.display=msg?'block':'none';$('login').style.display='';}
async function loginWith(p,sec){try{const r=await run('kassaLogin',[p]);if(!r.success){kzShowLogin(r.error);kzPost({type:'planeta-kassa-error',error:r.error});return}
  pw=p;me=r;$('login').style.display='none';$('app').style.display='grid';
  const ok=(NAV[r.role]||[]).some(n=>n.k===sec);section=ok?sec:(r.role==='director'?'overview':'inbox');
  await refresh();kzPost({type:'planeta-kassa-loggedin',role:r.role,section:section})}catch(e){kzShowLogin(e.message);kzPost({type:'planeta-kassa-error',error:e.message})}}
window.addEventListener('message',e=>{const d=e.data;if(!d||typeof d!=='object'||String(d.type||'').indexOf('planeta-kassa-')!==0)return;hostWin=e.source;
  if(d.type==='planeta-kassa-login'){kzLoginGot=true;clearTimeout(kzAnnT);enterEmbed();if(window.__kzTicket&&!me)return;if(me){kzPost({type:'planeta-kassa-loggedin',role:me.role,section:section});return}loginWith(String(d.pw||''),String(d.section||''))}
  else if(d.type==='planeta-kassa-go'){const k=String(d.section||'');if(S&&me&&(NAV[me.role]||[]).some(n=>n.k===k))go(k)}
  else if(d.type==='planeta-kassa-refresh'){if(S&&me)refresh()}});
try{google.script.url.getLocation(function(loc){if(loc&&loc.parameter&&String(loc.parameter.embed)==='1'){enterEmbed();
  const t=String(loc.parameter.t||'');
  if(t){kzLoginGot=true;window.__kzTicket=true;clearTimeout(kzAnnT);(async()=>{try{const r=await run('kassaLoginTicket',[t]);if(!r.success){kzShowLogin(r.error||'Не удалось войти по билету — введите код.');return}
      pw=r.pw||'';me=r;$('login').style.display='none';$('app').style.display='grid';const sec=String(loc.parameter.sec||'');section=(NAV[r.role]||[]).some(n=>n.k===sec)?sec:(r.role==='director'?'overview':'inbox');await refresh();kzPost({type:'planeta-kassa-loggedin',role:r.role,section:section})}catch(e){kzShowLogin(e.message)}})()}
  else setTimeout(()=>{if(!kzLoginGot&&!me)kzShowLogin('Кабинет не передал код доступа — введите его здесь.')},10000)}})}catch(e){}
const MONTHS_RU=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function nextMonths(from,n){const p=from.split(' ');let i=MONTHS_RU.indexOf(p[0]),y=+p[1];const out=[];for(let k=0;k<n;k++){i++;if(i>11){i=0;y++}out.push(MONTHS_RU[i]+' '+y)}return out}
function run(fn,args){return new Promise((res,rej)=>{const r=google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e.message||String(e))));r[fn].apply(r,args)})}
async function login(){const p=$('pw').value.trim();if(!p)return;$('lerr').style.display='none';try{const r=await run('kassaLogin',[p]);if(!r.success){$('lerr').textContent=r.error;$('lerr').style.display='block';return}pw=p;me=r;$('login').style.display='none';$('app').style.display='grid';section=r.role==='director'?'overview':'inbox';await refresh()}catch(e){$('lerr').textContent=e.message;$('lerr').style.display='block'}}
async function refresh(){try{const r=await run('kassaState',[pw]);if(!r.success){toast(r.error);return}S=r;render();kzStatePost()}catch(e){toast(e.message)}}
// счётчики для кабинета: главная страница и очередь «Требует решения» обновляются без повторного запроса к серверу
function kzStatePost(){if(!embed||!S)return;try{const inboxNew=S.inbox.filter(c=>!c.already),free=S.docs.filter(x=>x.status==='принят'&&x.left>0);kzPost({type:'planeta-kassa-state',today:S.today,inbox:{n:inboxNew.length,sum:inboxNew.reduce((a,c)=>a+(c.sum||0),0),items:inboxNew.slice(0,5).map(c=>({got:c.got,wa:c.wa,no:c.no,sum:c.sum}))},free:{n:free.length,sum:free.reduce((a,d)=>a+d.left,0),items:free.slice(0,5).map(d=>({no:d.no,left:d.left,phone:d.phone,date:d.date}))},clarify:{n:(S.data&&S.data.clarify||[]).length},problemsN:S.problems.length,problems:S.problems.slice(0,10),day:S.day,allFree:S.allFree,kassaOn:S.kassaOn,month:S.month})}catch(e){}}
const NAV={director:[{g:'Обзор'},{k:'overview',t:'Сегодня и сверка'},{g:'Деньги'},{k:'inbox',t:'Чеки'},{k:'docs',t:'Документы и зачёты'},{k:'debtors',t:'Должники'},{k:'advances',t:'Авансы по месяцам'},{k:'families',t:'Семьи и авансы'},{g:'Персонал'},{k:'payroll',t:'Зарплата'},{g:'Управление'},{k:'data',t:'Данные: уточнить и почистить'},{k:'trash',t:'Корзина'}],

 $('mode').innerHTML=S.kassaOn?'<span class="tag ok">режим кассы включён</span>'+(me.role==='director'?' <button onclick="setMode(false)" style="margin-top:6px">выключить</button>':''):'<span class="tag warn">режим кассы выключен</span><div style="margin:4px 0 6px;color:#c9d2ee">Старые экраны оплат тоже работают.</div>'+(me.role==='director'?'<button onclick="setMode(true)">Включить режим кассы</button>':'Включает руководитель.');const v=VIEWS[section];$('title').textContent=v.title;$('view').innerHTML=v.html()}
function go(k){section=k;render();if(k==='payroll')loadPayroll(window.PR?PR.month:S.month);if(embed)kzPost({type:'planeta-kassa-section',section:k})}
async function loadPayroll(month){try{const r=await run('kassaPayroll',[pw,month]);if(!r.success){toast(r.error);return}window.PR=r;if(section==='payroll')render()}catch(e){toast(e.message)}}
function togglePR(i){const el=$('prg'+i);if(el)el.style.display=el.style.display==='none'?'':'none'}
async function prSet(short,data){try{const r=await run('kassaPayrollSet',[pw,short,PR.month,data]);if(!r.success){toast(r.error)}await loadPayroll(PR.month)}catch(e){toast(e.message)}}
function prSlip(i){const t=PR.teachers[i];const txt='Уважаемая(ый) '+(t.full||t.short)+'!\n\nРасчёт за '+PR.month+' (абонемент 12 занятий, 28 дней). Заработная плата — '+money(t.toPay)+' сом:\n• базовая оплата за проведённые занятия — '+money(t.base)+' сом ('+t.held+' из '+t.planned+' занятий, '+t.payers+' оплативших учеников);\n• бонус за пунктуальность — '+money(t.punct)+' сом;\n• бонус за освоение материала — '+(t.test===null?'резерв '+money(t.masteryReserve)+' сом, раскрывается после теста':money(t.mastery)+' сом (сдали '+t.test+'%)')+'.\n\nВ среднем '+money(Math.round(t.toPay/4))+' сом в неделю и около '+money(t.perHour)+' сом за час занятия.\n\nСпасибо, что вы с нами.';$('box').classList.remove('wide');$('box').innerHTML='<h3>Расчётный листок</h3><div class="msg">'+esc(txt)+'</div><div class="actions"><button class="btn" onclick="closeModal()">Закрыть</button><button class="btn primary" onclick="navigator.clipboard.writeText('+JSON.stringify(txt).replace(/"/g,'&quot;')+');toast(\'Скопировано\')">Скопировать</button></div>';$('modal').classList.add('show')}
function fixedEdit(id){const f=(PR.fixed||[]).find(x=>x.id===id)||{name:'',role:'',sum:'',active:true,note:''};$('box').classList.remove('wide');$('box').innerHTML=`<h3>${id?'Оклад':'Новый оклад'}</h3><label>ФИО</label><input id="fxName" value="${esc(f.name)}"><label>Должность</label><input id="fxRole" value="${esc(f.role)}"><label>Сумма в месяц</label><input id="fxSum" type="number" value="${f.sum||''}"><label>Активна</label><select id="fxAct"><option value="1" ${f.active?'selected':''}>да</option><option value="0" ${f.active?'':'selected'}>нет</option></select><label>Примечание</label><input id="fxNote" value="${esc(f.note)}"><div class="actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="fixedSave('${esc(id)}')">Сохранить</button></div>`;$('modal').classList.add('show')}
async function fixedSave(id){const item={id:id||'',name:$('fxName').value.trim(),role:$('fxRole').value.trim(),sum:+$('fxSum').value||0,active:$('fxAct').value==='1',note:$('fxNote').value.trim()};closeModal();try{const r=await run('kassaFixedSet',[pw,item]);toast(r.success?'Сохранено':r.error);await loadPayroll(PR.month)}catch(e){toast(e.message)}}
async function fixedRemove(id){try{const r=await run('kassaFixedSet',[pw,{id:id,remove:true}]);toast(r.success?'Убрано':r.error);await loadPayroll(PR.month)}catch(e){toast(e.message)}}

 overview:{title:'Сегодня и сверка',html(){const d=S.day,ok=!S.problems.length;return `<div class="recon"><div class="day"><b>${S.today.slice(0,5)}</b></div><div><div class="lbl">Принято за день</div><div class="val">${money(d.accepted)}</div></div><div><div class="lbl">Зачтено</div><div class="val">${money(d.used)}</div></div><div><div class="lbl">Не распределено (всего по кассе)</div><div class="val">${money(S.allFree)}</div></div><div><div class="lbl">Возвращено за день</div><div class="val">${money(d.refunded)}</div></div><div class="state ${ok?'ok':'bad'}">${ok?'Сходится':'Проверьте: '+S.problems.length}</div></div>

 inbox:{title:'Чеки',html(){const q=S.inbox;return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Из WhatsApp — ждут зачёта</h2><div class="row"><select id="fetchH" class="btn" title="За какой период забрать чеки из WhatsApp"><option value="1">за час</option><option value="24" selected>за сутки</option><option value="72">за 3 дня</option><option value="168">за неделю</option></select><button class="btn" onclick="fetchRecent()">Забрать из WhatsApp</button>${S.inbox.some(c=>c.already)?'<button class="btn" onclick="skipRepeats()">Убрать все повторы</button>':''}<button class="btn" onclick="openAccept({no:'',date:'${S.today}',sum:0,phone:'',src:'наличные',editable:true})">Наличные</button><button class="btn primary" onclick="openAccept({no:'',date:'${S.today}',sum:0,phone:'',src:'МБанк',editable:true})">Принять чек вручную</button></div></div>

 return `<tr><td class="mute">${esc(c.got)}</td><td>${esc(c.wa)}<div class="mute">${esc(c.phone)}</div></td><td class="b">${esc(c.no)||'<span class="tag warn">без номера</span>'}${c.file?' <a href="'+esc(c.file)+'" target="_blank">чек</a>':''}</td><td class="num b">${c.sum?money(c.sum):'<span class="mute">впишите</span>'}${(!c.sum||!c.no||!/^[PР]\d{13}$|^KGNP\d{10,}$/.test(normNo(c.no)))&&c.file?'<div><button class="btn small" onclick="recognize(\''+c.id+'\')">Распознать</button></div>':''}</td><td>${f.map(s=>esc(s.name)+' <span class="mute">'+(bal(s)>0?'долг '+money(bal(s)):'оплачено')+'</span>').join('<br>')||'<span class="tag warn">не найдена по номеру</span>'}</td><td><button class="btn primary small" onclick="acceptInbox('${c.id}')">Принять</button> <button class="btn small" title="Повтор, не чек, уже зачтён под пометкой" onclick="skipInbox('${c.id}')">Пропустить</button></td></tr>`}).join('')}

 today:{title:'Сегодня',html(){const d=S.day;const td=S.docs.filter(x=>(x.by!=='перенос'&&x.at.indexOf(S.today)===0)||x.date===S.today);return `<div class="recon"><div class="day"><b>${S.today.slice(0,5)}</b></div><div><div class="lbl">Принято</div><div class="val">${money(d.accepted)}</div></div><div><div class="lbl">Зачтено</div><div class="val">${money(d.used)}</div></div><div><div class="lbl">Не распределено</div><div class="val">${money(d.free)}</div></div><div><div class="lbl">Документов</div><div class="val">${td.length}</div></div><div class="state ${S.problems.length?'bad':'ok'}">${S.problems.length?'Проверьте':'Сходится'}</div></div>

const normNo=v=>String(v||'').replace(/[^A-ZА-ЯЁ0-9]/gi,'').toUpperCase();
function docByNo(no){const k=normNo(no);return k?S.docs.find(d=>normNo(d.no)===k):null}
function noDate(no){const m=normNo(no).match(/^[PР](\d{2})(\d{2})\d{9}$/);if(!m)return null;const y=+S.today.slice(6,10);const d=new Date(y,+m[1]-1,+m[2]);return isNaN(d)?null:d}
function daysAgo(d){if(!d)return null;const t=new Date(+S.today.slice(6,10),+S.today.slice(3,5)-1,+S.today.slice(0,2));return Math.round((t-d)/86400000)}
function famByPhone(phone){const p=String(phone||'').replace(/\D/g,'');if(!p)return[];const direct=stu().filter(s=>(s.allPhones||[]).some(x=>x===p||(x.length>=9&&p.length>=9&&x.slice(-9)===p.slice(-9))));
 // семья по реестру скидок: у детей могут быть разные номера, но famId один — показываем всех вместе
 const ids={};direct.forEach(s=>{if(s.famId)ids[s.famId]=1});const all=Object.keys(ids).length?stu().filter(s=>ids[s.famId]):direct;return all.sort((a,b)=>a.name.localeCompare(b.name,'ru'))}
function fam(phone){const base=famByPhone(phone);const extra=(cur&&cur.extra||[]).map(id=>stu().find(s=>s.sid===id)).filter(s=>s&&!base.some(b=>b.sid===s.sid));return base.concat(extra)}
function addStudent(sid){if(!cur)return;const s=stu().find(x=>x.sid===sid);if(!cur.doc.phone&&s&&s.phone){cur.doc.phone=s.phone;const el=$('docFam');if(el)el.value=s.phone;plan()}cur.extra=cur.extra||[];if(cur.extra.indexOf(sid)===-1)cur.extra.push(sid);
 if(s&&s.famId)stu().filter(x=>x.famId===s.famId&&x.sid!==sid).forEach(x=>{if(cur.extra.indexOf(x.sid)===-1&&!famByPhone(cur.doc.phone).some(f=>f.sid===x.sid))cur.extra.push(x.sid)});if(s&&cur.alloc[sid]===undefined){const used=Object.values(cur.alloc).reduce((a,v)=>a+(+v||0),0);cur.alloc[sid]=Math.max(0,Math.min(bal(s),cur.doc.sum-used))}const n=$('docName');if(n)n.value='';redrawRight()}
function findStudents(q){q=String(q||'').toLowerCase().trim();if(q.length<2)return[];const f=famPlus(cur.doc).map(s=>s.sid);return stu().filter(s=>f.indexOf(s.sid)===-1&&s.name.toLowerCase().indexOf(q)!==-1).slice(0,8)}
function showStuHits(q){const el=$('stuHits');if(!el)return;const hits=findStudents(q);el.innerHTML=hits.length?'<div class="mute" style="margin:0 0 4px">Найдено по фамилии — нажмите «Добавить» (вся семья по реестру скидок добавится сразу):</div>'+hits.map(s=>'<div style="padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center"><span><b>'+esc(s.name)+'</b> <span class="mute">'+esc(s.group)+' · '+esc(s.teacher)+' · '+(bal(s)>0?'остаток '+money(bal(s)):'оплачено')+(s.phone?' · '+esc(s.phone):'')+'</span></span><button class="btn small" onclick="addStudent(\''+s.sid+'\')">Добавить</button></div>').join(''):(String(q||'').trim().length>=2?'<div class="mute" style="margin-bottom:6px">никого не найдено</div>':'')}

function acceptInbox(id){const c=S.inbox.find(x=>x.id===id);openAccept({no:c.no,date:(c.date&&/^\d{2}\.\d{2}\.\d{4}$/.test(c.date))?c.date:S.today,sum:c.sum,phone:c.phone,src:'МБанк',inboxId:id,file:c.file,editable:true})}
function skipInbox(id){const c=S.inbox.find(x=>x.id===id);$('box').classList.remove('wide');$('box').innerHTML=`<h3>Пропустить чек</h3><div class="mute">${esc(c.no||'без номера')} · ${esc(c.wa)} · ${c.sum?money(c.sum)+' сом':''}</div><label>Причина</label><select id="skReason"><option>повтор: чек уже зачтён под пометкой (МБ…)</option><option>повтор: уже принят другим номером</option><option>это не чек</option><option>чек за другой месяц / другой центр</option><option>другое</option></select><label>Уточнение (по желанию)</label><input id="skNote"><div class="actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn danger" onclick="doSkip('${esc(id)}')">Пропустить</button></div>`;$('modal').classList.add('show')}

function openAllocate(no){const x=S.docs.find(d=>d.no===no);if(!x)return;openAccept({no:x.no,date:x.date,sum:x.left,fullSum:x.sum,phone:x.phone,src:x.src,existing:true})}
function openAccept(doc){cur={doc,alloc:{},extra:[],prepay:{sid:'',month:nextMonths(S.month,1)[0],sum:0}};plan();$('box').classList.add('wide');$('box').innerHTML=acceptHtml();$('modal').classList.add('show')}
function plan(){const f=famPlus(cur.doc);let left=cur.doc.sum;cur.alloc={};f.forEach(s=>{const need=Math.max(0,bal(s));const give=Math.min(need,left);cur.alloc[s.sid]=give;left-=give});cur.prepay={sid:f[0]?f[0].sid:'',month:cur.prepay.month,sum:Math.max(0,left)}}
function famPlus(d){const f=fam(d.phone).slice();((cur&&cur.extra)||[]).concat(d.extra||[]).forEach(sid=>{if(!f.some(s=>s.sid===sid)){const s=stu().find(x=>x.sid===sid);if(s)f.push(s)}});return f}
function acceptCalc(){const d=cur.doc,f=famPlus(d);const allocSum=Object.values(cur.alloc).reduce((s,v)=>s+(+v||0),0),left=d.sum-allocSum,prepay=left>0?Math.min(left,+cur.prepay.sum||0):0;return {d,f,allocSum,left,prepay,unassigned:left-prepay,over:allocSum>d.sum,debts:f.map(s=>({s,debt:Math.max(0,bal(s)-(+cur.alloc[s.sid]||0))})).filter(x=>x.debt>0),dup:!d.existing&&S.docs.some(x=>x.no.replace(/[^A-ZА-ЯЁ0-9]/gi,'').toUpperCase()===String(d.no).replace(/[^A-ZА-ЯЁ0-9]/gi,'').toUpperCase()&&d.no),cash:/налич/i.test(d.src)}}
function leftHtml(){const {d,cash}=acceptCalc();const phoneShown=d.phone?d.phone:'996';
 return `<div class="mute">${esc(d.src)}${d.existing?' · документ уже принят, зачитывается остаток':''}</div>${d.existing?'<div class="mute">Сумма документа '+money(d.fullSum)+', свободно:</div>':''}<div class="sum">${d.editable?'<input id="docSum" type="number" placeholder="сумма" value="'+(d.sum||'')+'" oninput="cur.doc.sum=+this.value||0;plan();redrawRight()">':money(d.sum)+' <span style="font-size:15px;font-weight:600">сом</span>'}</div>
 <label>Номер документа</label>${d.existing?'<b>'+esc(d.no)+'</b>':cash?'<div class="mute">номер Н-… присвоится сам</div>':(d.editable?'<input id="docNo" placeholder="Р… из чека" value="'+esc(d.no)+'" oninput="cur.doc.no=this.value.trim();redrawNotes()">':'<b>'+esc(d.no)+'</b>')}
 <label>Дата</label><input id="docDate" value="${esc(d.date)}" oninput="cur.doc.date=this.value"${d.existing?' disabled':''}>
 <label>Телефон родителя</label><input id="docFam" name="fam-${Date.now()}" type="search" autocomplete="off" autocorrect="off" spellcheck="false" readonly placeholder="996…" value="${d.existing?esc(d.phone):esc(phoneShown)}" oninput="onPhoneInput(this)" onfocus="this.removeAttribute('readonly')" onmousedown="this.removeAttribute('readonly')">
 <label>Фамилия ученика (если платят наличными по записке или чек за другого ребёнка)</label><input id="docName" name="nm-${Date.now()}" type="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="начните вводить фамилию" oninput="showStuHits(this.value)">
 ${d.editable?'<label>Источник</label><select onchange="cur.doc.src=this.value;redrawLeft()">'+['МБанк','наличные','другой банк'].map(x=>'<option '+(x===d.src?'selected':'')+'>'+x+'</option>').join('')+'</select>':''}
 <div id="leftNotes">${notesHtml()}</div>`}
function notesHtml(){const {d,f,dup}=acceptCalc();let out='';
 if(dup){const x=docByNo(d.no);const who=(S.docWho||{})[normNo(d.no)]||[];out+='<div class="note bad">Этот номер уже принят'+(x?' '+esc(x.date):'')+(who.length?': '+esc(who.join(', ')):'')+'. Второй раз зачесть один чек нельзя.</div>'}
 if(d.phone&&!f.length)out+='<div class="note">По этому номеру ученики не найдены в '+esc(S.month)+'. Проверьте номер.</div>';
 if(!d.existing&&!dup){const ago=daysAgo(noDate(d.no));if(ago!==null&&ago>=2)out+='<div class="note">Чек датирован '+esc(noDate(d.no).toLocaleDateString('ru-RU'))+' — '+ago+' дн. назад. Проверьте, не зачтён ли он раньше под другим номером или пометкой.</div>';
  // «похоже на повтор» — только если старый документ записан без настоящего банковского номера (пометка, наличные, Б/Н):
  // два разных настоящих номера на одну сумму — это два перевода (например, за двоих детей), а не повтор
  const realNo=n=>/^[PР]\d{13}$/.test(normNo(n))||/^KGNP\d{10,}$/.test(normNo(n));
  const names=f.map(s=>s.name);const same=S.docs.filter(x=>x.status==='принят'&&x.sum===d.sum&&normNo(x.no)!==normNo(d.no)&&!(realNo(d.no)&&realNo(x.no))&&(x.phone&&x.phone===d.phone||((S.docWho||{})[normNo(x.no)]||[]).some(w=>names.some(n=>w.indexOf(n)===0))));
  // документы-пометки этой семьи (МБ…, Б/Н, наличные без чека): если их сумма равна чеку — почти наверняка тот же перевод
  const pseudo=S.docs.filter(x=>x.status==='принят'&&!realNo(x.no)&&normNo(x.no)!==normNo(d.no)&&(x.phone&&x.phone===d.phone||((S.docWho||{})[normNo(x.no)]||[]).some(w=>names.some(n=>w.indexOf(n)===0))));
  const pseudoSum=pseudo.reduce((s,x)=>s+x.sum,0);
  if(same.length)out+='<div class="note bad">Похоже на повтор: у этой семьи уже есть документ на '+money(d.sum)+' — '+same.map(x=>esc(x.no)+' ('+esc(x.date)+', '+esc(((S.docWho||{})[normNo(x.no)]||[]).join(', '))+')').join('; ')+'. Если это тот же перевод — «Пропустить чек», а руководитель уточнит номер у того документа.</div>';
  else if(pseudo.length&&pseudoSum===d.sum)out+='<div class="note bad">Похоже на повтор: платежи этой семьи записаны пометками без номера — '+pseudo.map(x=>esc(x.no)+' '+money(x.sum)).join(' + ')+' = '+money(pseudoSum)+', ровно сумма чека. Скорее всего, это тот же перевод: нажмите «Пропустить чек», а руководитель через «Данные → Уточнить №» привяжет настоящий номер к тем документам.</div>';
  else if(f.length&&f.every(s=>bal(s)<=0)&&d.sum>0)out+='<div class="note">У всей семьи сентябрь уже оплачен. Принять можно только как аванс — убедитесь, что это новые деньги, а не повтор старого чека.</div>'}
 return out}
function tableHtml(){const {d,f,over}=acceptCalc();
 return `<table class="alloc"><thead><tr><th>Ученик</th><th class="num">К оплате</th><th class="num">Оплачено</th><th class="num">Остаток</th><th class="num">Зачесть</th></tr></thead><tbody>${f.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="mute">${esc(s.group)} · ${esc(s.teacher)}${s.disc?' · −'+s.disc+'%':''}</div></td><td class="num">${money(s.tuition)}</td><td class="num">${money(s.paid)}</td><td class="num">${money(bal(s))}</td><td class="num"><input id="al_${s.sid}" type="number" min="0" class="${over?'over':''}" value="${cur.alloc[s.sid]||0}" oninput="cur.alloc['${s.sid}']=+this.value||0;redrawSummary()"></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Укажите телефон родителя или введите фамилию ученика слева.</td></tr>'}</tbody></table>`}
function summaryHtml(){const {d,f,allocSum,left,prepay,unassigned,over,debts,dup,cash}=acceptCalc();const canSave=(d.no||cash)&&d.sum>0&&!over&&!dup&&f.length&&allocSum+prepay>0;
 return `<div class="total"><span>Зачтено ученикам</span><span class="num big">${money(allocSum)}</span>
 ${left>0&&f.length?`<span>Остаток → аванс <select onchange="cur.prepay.sid=this.value;redrawSummary()">${f.map(s=>'<option value="'+s.sid+'" '+(s.sid===cur.prepay.sid?'selected':'')+'>'+esc(s.name)+'</option>').join('')}</select> на <select onchange="cur.prepay.month=this.value;redrawSummary()">${nextMonths(S.month,12).map(m=>'<option '+(m===cur.prepay.month?'selected':'')+'>'+m+'</option>').join('')}</select></span><span class="num"><input id="ppSum" type="number" min="0" max="${left}" value="${prepay}" onchange="cur.prepay.sum=Math.min(${left},+this.value||0);redrawSummary()" style="width:110px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;text-align:right"></span>`:''}
 ${unassigned>0?`<span class="mute">Останется нераспределённым</span><span class="num mute">${money(unassigned)}</span>`:''}<span class="b">${d.existing?'Свободно по документу':'Сумма документа'}</span><span class="num big">${money(d.sum)}</span></div>
 ${over?'<div class="note bad">Зачтено больше суммы документа на '+money(allocSum-d.sum)+'.</div>':''}${!over&&debts.length&&d.sum>0?'<div class="note">После зачёта останется долг: '+debts.map(x=>esc(x.s.name)+' — '+money(x.debt)).join(', ')+'.</div>':''}${!over&&!debts.length&&d.sum>0&&f.length?'<div class="note ok">У семьи долгов не останется'+(prepay>0?', аванс '+money(prepay)+' — на '+esc(cur.prepay.month).toLowerCase():'')+'.</div>':''}
 <div class="actions">${d.inboxId?'<button class="btn" onclick="closeModal();skipInbox(\''+esc(d.inboxId)+'\')">Пропустить чек</button>':''}<button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" id="okBtn" ${canSave?'':'disabled'} onclick="confirmAccept()">${d.existing?'Зачесть':'Принять документ'}</button></div>`}
function rightHtml(){const {d,f}=acceptCalc();return `<h3 style="margin:0 0 4px">Кому зачесть</h3><div class="mute" style="margin-bottom:8px">Семья по номеру ${esc(d.phone)||'—'}: ${f.length}. Суммы можно передвинуть, превысить чек — нельзя.</div><div id="stuHits"></div><div id="allocTable">${tableHtml()}</div><div id="allocSummary">${summaryHtml()}</div>`}
function acceptHtml(){return `<div class="accept"><div class="receipt" id="acceptLeft">${leftHtml()}</div><div id="acceptRight">${rightHtml()}</div></div>`}
// перерисовываем только ту часть окна, где ничего не печатают — поле ввода с курсором не трогаем
function redrawRight(){$('acceptRight').innerHTML=rightHtml();redrawNotes()}
function redrawNotes(){const n=$('leftNotes');if(n)n.innerHTML=notesHtml();const s=$('allocSummary');if(s)s.innerHTML=summaryHtml()}
function redrawLeft(){$('acceptLeft').innerHTML=leftHtml();redrawRight()}
function redrawSummary(){const {over}=acceptCalc();document.querySelectorAll('.alloc input').forEach(i=>i.classList.toggle('over',over));$('allocSummary').innerHTML=summaryHtml()}
function redraw(){$('box').innerHTML=acceptHtml()}
// телефон: 996 подставляется сам; можно набрать 9 цифр без кода, «0700…» или фамилию ученика
function normPhone(v){let d=String(v||'').replace(/\D/g,'');if(d.length===10&&d[0]==='0')d='996'+d.slice(1);if(d.length===9&&d[0]!=='9')d='996'+d;if(d.length===9&&d.slice(0,3)!=='996')d='996'+d;return d}
function onPhoneInput(el){const d=normPhone(el.value);cur.doc.phone=(d.length>=12)?d:'';if(d.length>=12&&el.value!==d){el.value=d}plan();redrawRight()}
async function confirmAccept(){const d=cur.doc,f=fam(d.phone);const allocs=[];f.forEach(s=>{const v=+cur.alloc[s.sid]||0;if(v>0)allocs.push({sid:s.sid,name:s.name,month:S.month,gid:s.gid,kind:'обучение',sum:v})});const allocSum=allocs.reduce((s,a)=>s+a.sum,0),left=d.sum-allocSum,pp=left>0?Math.min(left,+cur.prepay.sum||0):0;if(pp>0)allocs.push({sid:cur.prepay.sid,month:cur.prepay.month,kind:'аванс',sum:pp});
 $('okBtn').disabled=true;$('okBtn').textContent='Сохраняю…';try{const r=d.existing?await run('kassaAllocate',[pw,d.no,allocs]):await run('kassaAccept',[pw,{no:d.no,date:d.date,sum:d.sum,phone:d.phone,src:d.src,inboxId:d.inboxId||'',file:d.file||''},allocs]);if(!r.success){toast(r.error);$('okBtn').disabled=false;$('okBtn').textContent=d.existing?'Зачесть':'Принять документ';return}
 $('box').classList.remove('wide');$('box').innerHTML=`<h3>Принято</h3><div class="mute" style="margin-bottom:8px">${esc(r.message)}</div><div class="msg">${esc(r.text)}</div><div class="actions"><button class="btn" onclick="closeModal()">Не отправлять</button><button class="btn primary" onclick="sendText('${esc(r.phone)}',${JSON.stringify(r.text).replace(/"/g,'&quot;')})">Отправить в WhatsApp</button></div>`;await refresh()}catch(e){toast(e.message);$('okBtn').disabled=false;$('okBtn').textContent='Принять документ'}}
async function sendText(phone,text){closeModal();try{const r=await run('kassaSend',[pw,phone,text]);toast(r.success?r.message:r.error)}catch(e){toast(e.message)}}
function closeModal(){$('modal').classList.remove('show');$('box').classList.remove('wide')}
function storno(id){const a=S.allocs.find(x=>x.id===id);$('box').innerHTML=`<h3>Сторно зачёта</h3><div>${esc(a.no)} · ${esc(a.name)} · ${esc(a.month)} · <b>${money(a.sum)} сом</b></div><label>Причина</label><input id="reason" placeholder="например: зачтено не тому ребёнку"><div class="actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn danger" onclick="doStorno('${esc(id)}')">Сторнировать</button></div>`;$('modal').classList.add('show')}
async function doStorno(id){const r=$('reason').value.trim();if(!r){$('reason').focus();return}closeModal();try{const a=S.allocs.find(x=>x.id===id);const res=await run('kassaStorno',[pw,id,r]);toast(res.success?res.message:res.error);if(res.success){try{await run('kassaTrashPut',[pw,'зачёт',a.no+' · '+a.name+' · '+money(a.sum)+' сом',JSON.stringify(a),r])}catch(e){}await refresh()}}catch(e){toast(e.message)}}
function refund(no,left){$('box').innerHTML=`<h3>Возврат родителю</h3><div>Документ ${esc(no)} · свободно <b>${money(left)} сом</b></div><label>Сумма</label><input id="rsum" type="number" value="${left}" max="${left}"><label>Как выдали</label><select id="rmet"><option>наличные</option><option>перевод на МБанк</option></select><label>Причина</label><input id="rreason"><div class="actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="doRefund('${esc(no)}')">Оформить возврат</button></div>`;$('modal').classList.add('show')}
async function doRefund(no){const sum=+$('rsum').value||0,m=$('rmet').value,r=$('rreason').value.trim();if(!(sum>0)||!r){toast('Укажите сумму и причину');return}closeModal();try{const res=await run('kassaRefund',[pw,no,sum,m,r]);toast(res.success?res.message:res.error);await refresh()}catch(e){toast(e.message)}}
async function setMode(on){if(on&&!(await confirmMode()))return;try{const r=await run('kassaSetMode',[pw,on]);toast(r.success?r.message:r.error);await refresh()}catch(e){toast(e.message)}}
function confirmMode(){return new Promise(res=>{$('box').innerHTML=`<h3>Включить режим кассы?</h3><div class="mute">С этого момента оплаты принимаются и исправляются только здесь. В журнале поля «Оплачено» и «Квитанция» становятся только для чтения, кнопки «зачесть», «+ доплата», «Записать в предоплату», «Исправить сумму», удаление и аннулирование отключаются. Переплаты после снижения цены уходят в авансы автоматически. Выключить можно в любой момент этой же кнопкой.</div><div class="actions"><button class="btn" onclick="closeModal();window.__res(false)">Отмена</button><button class="btn primary" onclick="closeModal();window.__res(true)">Включить</button></div>`;window.__res=res;$('modal').classList.add('show')})}
function filterDocs(q){q=String(q||'').toLowerCase().trim();document.querySelectorAll('tr.docrow').forEach(tr=>{tr.style.display=!q||(tr.getAttribute('data-q')||'').indexOf(q)!==-1?'':'none'})}
function filterClarify(q){q=String(q||'').toLowerCase().trim();document.querySelectorAll('#clarifyRows tr').forEach(tr=>{tr.style.display=!q||(tr.getAttribute('data-q')||'').indexOf(q)!==-1?'':'none'})}
function renameDoc(no){$('box').innerHTML=`<h3>Настоящий номер документа</h3><div>Сейчас: <b>${esc(no)}</b></div><label>Номер с чека (Р… 13 цифр) или Н-… для наличных</label><input id="rnNo" placeholder="Р0909042458659"><label>Источник</label><select id="rnSrc"><option>МБанк</option><option>наличные</option><option>другой банк</option></select><div class="actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="doRename('${esc(no)}')">Заменить</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('rnNo').focus(),50)}
async function doRename(no){const nn=$('rnNo').value.trim(),src=$('rnSrc').value;if(!nn){$('rnNo').focus();return}closeModal();try{const r=await run('kassaRenameDoc',[pw,no,nn,src]);toast(r.success?r.message:r.error);await refresh()}catch(e){toast(e.message)}}
async function cleanup(dry){const out=$('cleanOut');out.innerHTML='<span class="mute">Выполняю…</span>';try{if(!dry){ $('box').innerHTML=`<h3>Выполнить чистку?</h3><div class="mute">Тестовые карточки и их архив — в корзину (восстановимо), их документы — сторно. ФИО со скидкой в имени переименовываются во всех листах. Продолжить?</div><div class="actions"><button class="btn" onclick="closeModal();window.__res(false)">Отмена</button><button class="btn primary" onclick="closeModal();window.__res(true)">Выполнить</button></div>`;const ok=await new Promise(res=>{window.__res=res;$('modal').classList.add('show')});if(!ok){out.innerHTML='';return}}
 const r=await run('kassaCleanup',[pw,{tests:true,names:true},!!dry]);if(!r.success){out.innerHTML='<span class="tag bad">'+esc(r.error)+'</span>';return}const x=r.result;
 out.innerHTML='<div class="mute">'+esc(r.message)+'</div><ul style="margin:6px 0 0 18px">'+(x.tests.length?'<li>Тестовые карточки ('+x.tests.length+'): '+esc(x.tests.join(', '))+'</li>':'<li>Тестовых карточек нет</li>')+(x.docs&&x.docs.length?'<li>Документы сторно: '+esc(x.docs.join(', '))+'</li>':'')+(x.names.length?'<li>Переименования:<ul>'+x.names.map(n=>'<li>'+esc(n.from)+' → '+esc(n.to)+(n.skipped?' <span class="tag warn">'+esc(n.skipped)+'</span>':(n.done?' <span class="tag ok">готово</span>':''))+'</li>').join('')+'</ul></li>':'<li>Имён со скидкой нет</li>')+'</ul>';if(!dry)await refresh()}catch(e){out.innerHTML='<span class="tag bad">'+esc(e.message)+'</span>'}}
async function catchUp(dry){const out=$('cuOut');out.innerHTML='<span class="mute">Выполняю…</span>';try{const r=await run('kassaCatchUp',[pw,!!dry]);if(!r.success){out.innerHTML='<span class="tag bad">'+esc(r.error)+'</span>';return}const x=r.result;out.innerHTML='<div class="mute">'+esc(r.message)+'</div>'+(x.added.length?'<ul style="margin:6px 0 0 18px">'+x.added.map(a=>'<li>'+esc(a.name)+' ('+esc(a.group)+') — '+money(a.sum)+' сом, документ '+esc(a.no)+(a.existing?' (уже в кассе)':'')+'</li>').join('')+'</ul>':'')+(x.manual.length?'<div style="margin-top:6px">'+x.manual.map(m=>'<div class="tag warn" style="margin:2px 0">'+esc(m)+'</div>').join('')+'</div>':'');if(!dry)await refresh()}catch(e){out.innerHTML='<span class="tag bad">'+esc(e.message)+'</span>'}}
function voidDoc(no,sum){$('box').classList.remove('wide');$('box').innerHTML=`<h3>Сторно документа</h3><div>Документ ${esc(no)} · <b>${money(sum)} сом</b>, зачётов нет</div><div class="mute" style="margin-top:6px">Для записей, которых на самом деле не было (оплата внесена по ошибке, без чека). Документ остаётся в книге с пометкой «сторнирован» и не считается в деньгах.</div><label>Причина</label><input id="vdReason" placeholder="например: ошибочная запись, оплаты не было"><div class="actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn danger" onclick="doVoidDoc('${esc(no)}')">Сторнировать</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('vdReason').focus(),50)}
async function doVoidDoc(no){const r=$('vdReason').value.trim();if(!r){$('vdReason').focus();return}closeModal();try{const res=await run('kassaVoidDoc',[pw,no,r]);toast(res.success?res.message:res.error);await refresh()}catch(e){toast(e.message)}}
function fixSum(no,sum,used){$('box').innerHTML=`<h3>Исправить сумму документа</h3><div>Документ ${esc(no)} · сейчас <b>${money(sum)} сом</b>, зачтено ${money(used)}</div><div class="mute" style="margin-top:6px">Для опечаток при вводе (например, 25 000 вместо 2 500). Сумма не может быть меньше уже зачтённого. Если деньги действительно пришли и лишние — это не сюда, а «Возврат» или аванс.</div><label>Настоящая сумма с чека</label><input id="fsSum" type="number" value="${used}"><label>Причина</label><input id="fsReason" placeholder="опечатка при вводе"><div class="actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" onclick="doFixSum('${esc(no)}')">Исправить</button></div>`;$('modal').classList.add('show');setTimeout(()=>$('fsSum').focus(),50)}
async function doFixSum(no){const sum=+$('fsSum').value||0,r=$('fsReason').value.trim();if(!(sum>0)||!r){toast('Укажите сумму и причину');return}closeModal();try{const res=await run('kassaFixDocSum',[pw,no,sum,r]);toast(res.success?res.message:res.error);await refresh()}catch(e){toast(e.message)}}
async function restore(id){try{const r=await run('kassaTrashRestore',[pw,id]);toast(r.success?r.message:r.error);await refresh()}catch(e){toast(e.message)}}
let tt=null;function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),3500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
</body>
</html>
