/* Страница договора для родителей (v13, сборка 595: журнал отвечает не дольше 50 с — иначе второй запрос сам, потом «Повторить»; через 8 с подсказка «сервер отвечает дольше обычного»; подпись уходит POST-запросом (браузер не повторяет его сам — двойных записей нет); v12, сборка 580: три шага с индикатором; обязательны только ФИО и номер паспорта, остальное — «Кошумча маалымат (милдеттүү эмес)», раскрывается само, если прочиталось с фото / из анкеты / из договора семьи; второму ребёнку паспорт родителя подставляется из уже подписанного договора семьи (sib); «же колуңуз менен жазыңыз» видно всегда, пока нет карточки; перед полным текстом — выжимка (brief, текст ДОГОВОР_КЫСКАЧА); подписи словом нет — галочка + кнопка (п. 5.6), sign не отправляется; после подписи — «Эч нерсе жөнөтүүнүн кереги жок» и кнопки на других детей семьи (siblings); распознавание не работает (ocrDown) — сразу ручной ввод; v11, сборка 573: ФИО только из паспорта — из заявки не подставляется (серая строка «в заявке было»), латиница из машиночитаемой строки как подсказка, поле пустое и оранжевое, пока ФИО не прочитано или не вписано; строки «Окуучуга ким болот» нет — в договоре только ФИО как в паспорте; v10, сборка 572: перед подписью — галочка «Келишимди окудум, макулмун»; кнопка активна только с галочкой и подписью, отметка о галочке уходит в журнал (agree=1); v9, сборка 571: в сообщении об ошибке нет строки «можно ответить «Макул» в чат» — договор подписывается только на странице; v8, сборка 570: номер и код из ссылки берутся без приклеенного хвоста — ссылка, вставленная в WhatsApp дважды подряд или без пробела перед текстом, открывается; v7, сборка 565: текст договора на странице заполняется введённым сразу (бланк tpl с полями родителя); ФИО из анкеты
   убирается, если пол по паспорту ему не соответствует; v6, сборка 564: паспорт по двум сторонам — две плитки «лицевая / обратная», данные считываются сами после второго снимка,
   карточка «По паспорту» с правкой строк, мама/папа по полу из паспорта, ручной ввод под ссылкой; убраны кнопки ID/AN/AC, МКК/СӨМ и вопрос «кто заполняет»;
   v5, сборка 563: «кто заполняет» (мама / папа / представитель) — договор с тем, кто подписал; ученик 18+ — свои данные,
   договор с ним самим; предупреждение о просроченном паспорте; «данные подтверждены по машиночитаемой строке» после снимка; v4, сборка 562: скрины из «Түндүк» — несколько картинок за раз, орган СӨМ, адрес прописки, ФИО кириллицей с подсказкой;

<div class="w" id="w">

<script>
/* ctdoc.js — общий отрисовщик договора (сборка 560). Используется в pages/dogovor.html (страница родителя) и в SearchPage.html
   (окно «Договор» в кабинете и печать). Вход: сохранённый текст договора (строки через \n) и список значений, которые надо выделить
   (данные родителя). Выход: HTML с классами .ttl .num .dt .party .d h3 p .signs .who .sg .sigline .mute .note — стили в контейнере .ctdoc. */
function ctDocHtml(text, marks) {
  var esc = function(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ms = (marks || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return v.length >= 3; }).sort(function(a, b) { return b.length - a.length; });
  var re = ms.length ? new RegExp(ms.map(function(v) { return esc(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g') : null;
  var hl = function(s) { var e = esc(s); return re ? e.replace(re, function(m) { return '<b class="d">' + m + '</b>'; }) : e; };
  var lines = String(text || '').split('\n').map(function(s) { return s.trim(); });
  var notes = []; lines = lines.filter(function(l) { if (/^\[.*\]$/.test(l)) { notes.push(l); return false; } return true; });
  var isHead = function(l) { return /^\d+\. [^a-zа-я]*$/.test(l); };
  var out = [], i = 0;
  while (i < lines.length && !lines[i]) i++;
  if (i < lines.length && !/^КЕЛИШИМ/.test(lines[i]) && !isHead(lines[i])) { out.push('<div class="ttl">' + hl(lines[i]) + '</div>'); i++; }
  if (i < lines.length && /^КЕЛИШИМ №/.test(lines[i])) { out.push('<div class="num">' + hl(lines[i]) + '</div>'); i++; }
  var sig6 = -1; for (var k = i; k < lines.length; k++) if (/^6\. /.test(lines[k]) && /РЕКВИЗИТ|КОЛ ТАМГА/.test(lines[k])) { sig6 = k; break; }
  var party = [], flush = function() { if (party.length) { out.push('<div class="party">' + party.join('') + '</div>'); party = []; } };
  for (; i < (sig6 < 0 ? lines.length : sig6); i++) {
    var l = lines[i]; if (!l) continue;
    if (/^Талас шаары/.test(l)) { flush(); var m = l.match(/^(Талас шаары)\s+(.*)$/); out.push('<div class="dt"><span>' + hl(m ? m[1] : l) + '</span><span>' + hl(m ? m[2] : '') + '</span></div>'); continue; }
    if (/^(Ата-эненин\/Мыйзамдуу өкүлдүн Аты-жөнү|Паспорт \(сериясы, номери\)|Дареги \/ Адрес|Телефон 1):/.test(l)) { party.push('<div>' + hl(l) + '</div>'); continue; }
    flush();
    out.push(isHead(l) ? '<h3>' + hl(l) + '</h3>' : '<p>' + hl(l) + '</p>');
  }
  flush();
  if (sig6 >= 0) {
    out.push('<h3>' + hl(lines[sig6]) + '</h3>');
    var left = [], right = [], side = 0;
    for (var j = sig6 + 1; j < lines.length; j++) {
      var s = lines[j]; if (!s) continue;
      if (/^АТКАРУУЧУ/.test(s)) { side = 1; right.push('<div class="who">' + hl(s.replace(/:$/, '')) + '</div>'); continue; }
      if (/^БУЮРТМАЧЫ/.test(s)) { side = 0; left.push('<div class="who">' + hl(s.replace(/:$/, '')) + '</div>'); continue; }
      if (side === 0) {
        var sm = s.match(/^Кол тамгасы:\s*(.*)$/);
        if (sm) { var v = sm[1], mm = v.match(/^«([^»]+)»\s*—\s*(.*)$/); left.push(mm ? '<div class="sg">Кол тамгасы: <span class="sigline">' + esc(mm[1]) + '</span></div><div class="mute">' + hl(mm[2]) + '</div>' : '<div class="sg">' + hl(s) + '</div>'); continue; }
        left.push('<div>' + hl(s) + '</div>');
      } else right.push('<div>' + hl(s) + '</div>');
    }
    out.push('<div class="signs"><div>' + left.join('') + '</div><div>' + right.join('') + '</div></div>');
  }
  notes.forEach(function(nn) { out.push('<p class="note">' + esc(nn) + '</p>'); });
  return out.join('');
}
var CTDOC_CSS = '.ctdoc{font-family:"Times New Roman",Times,serif;font-size:14px;line-height:1.55;color:#111}.ctdoc .ttl{text-align:center;font-weight:700;font-size:15px;margin:0 0 2px}.ctdoc .num{text-align:center;font-weight:700;margin:0 0 8px}.ctdoc .dt{display:flex;justify-content:space-between;gap:12px;color:#334155;margin:0 0 10px}.ctdoc .party{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin:8px 0}.ctdoc .party div{margin:2px 0}.ctdoc b.d{background:#fef3c7;padding:0 3px;border-radius:3px;font-weight:700}.ctdoc h3{font-size:14px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.3px}.ctdoc p{margin:0 0 5px;text-align:justify}.ctdoc .signs{display:flex;gap:14px;margin-top:12px}.ctdoc .signs>div{flex:1;min-width:0;border-top:1px solid #cbd5e1;padding-top:8px}.ctdoc .who{font-weight:700;font-size:12.5px;letter-spacing:.3px;margin-bottom:2px}.ctdoc .sg{margin-top:8px}.ctdoc .sigline{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:21px;color:#173f67;border-bottom:1.5px solid #173f67;display:inline-block;padding:0 6px 2px;min-width:120px}.ctdoc .mute{color:#64748b;font-size:12px}.ctdoc .note{color:#64748b;font-size:12px;margin-top:10px}@media (max-width:480px){.ctdoc .signs{flex-direction:column}}@media print{.ctdoc .party{border-color:#000;background:#fff}.ctdoc b.d{background:#fff}.ctdoc .sigline{color:#000;border-color:#000}}';

document.getElementById('ctdocCss').textContent = CTDOC_CSS;
/* Адрес журнала «Планета» (веб-приложение Apps Script). Запросы идут без cookies — анонимно, поэтому аккаунты Google на телефоне не мешают. */
var API = 'https://script.google.com/macros/s/AKfycby0O1aycallOk5fTZUa5L_CG432hMARssdKtmOHsJzMaqOHvFUkYrYUCQKeqyTxCW8rcQ/exec';
var Q = new URLSearchParams(location.search);
/* v8 (сборка 570): «склеенные» ссылки — WhatsApp приклеивает к адресу вторую ссылку или текст без пробела, и код приходил с хвостом
   («t=…779217bhttps://…») → «Шилтеме жараксыз». Берём только сам номер (цифры, u…, z…, З-…, ЗВ-…, У-…) и первые 16 знаков кода. */
var ID = (String(Q.get('id') || '').trim().match(/^[A-Za-zА-Яа-я]{0,2}-?\d+/) || [''])[0];
var T = (String(Q.get('t') || '').trim().match(/^[0-9a-f]{16}/i) || [''])[0].toLowerCase();
/* &test=1 — тестовый режим (журнал разрешает его только для ссылки на номер руководителя): форма открывается и у принятого договора, ничего не сохраняется */
var TEST = Q.get('test') === '1';
var D = null, ADULT = false;
var PHONE_CENTRE = '0755 494 494';
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
/* v13: пределы ожидания (мс); для проверок можно переопределить window.__ctT до загрузки */
var CT_T = Object.assign({ wait: 50000, hint: 8000 }, window.__ctT || {});
function api(params, waitMs) {

  if (!D.tpl || !$('sum')) { box.innerHTML = docHtml(D.text, D.marks); return; }
  var v = function(id) { var el = $(id); return el ? el.value.trim().replace(/\s+/g, ' ') : ''; };
  var name = v('p_name'), doc = v('p_doc').toUpperCase(), issuer = v('p_issuer'), dt = d2(v('p_date')), vl = d2(v('p_valid')), addr = v('p_addr');
  var parent = name || '______________________';
  var map = { 'родитель': parent, 'окуучу_фио': name || D.student || '', 'паспорт': doc || '__________', 'выдан': (issuer ? issuer + (dt ? ', ' + dt : '') : dt) || '__________', 'срок': vl || '__________', 'адрес': addr || '________________' };
  var text = D.tpl; Object.keys(map).forEach(function(k) { text = text.split('{' + k + '}').join(map[k]); });
  var marks = (D.marks || []).concat([name, doc, issuer, dt, vl, addr].filter(function(x) { return x && x.length >= 3; }));
  box.innerHTML = docHtml(text, marks);
}
var liveT = null; function liveSoon() { clearTimeout(liveT); liveT = setTimeout(liveDoc, 250); }
/* поля из снимков → карточка «По паспорту»: прочитанное — зелёным, недостающее — оранжевым с подсказкой, какую сторону снять. Возвращает число заполненных полей */
function camFill(f) {
  if (!(f.name || (f.ser && f.num) || f.code || f.iss || f.val || f.addr)) return 0;   /* ничего не прочитано — карточку не трогаем */
  if (!$('sum')) $('sumWrap').innerHTML = sumHtml('', '✓ Паспорт боюнча / По паспорту — текшериңиз / проверьте');
  $('manualWrap').innerHTML = ''; $('sum').classList.remove('manual'); $('sumTitle').textContent = '✓ Паспорт боюнча / По паспорту — текшериңиз / проверьте';
  var k = 0, set = function(id, v) { var el = $(id); if (!el) return; el.classList.remove('need'); if (v) { el.value = v; el.classList.add('rec'); k++; } else if (!el.value) el.classList.add('need'); };
  if (f.nameLat) NAME_LAT = String(f.nameLat); var nh = $('nameHint'); if (nh) nh.outerHTML = nameHint();
  if (f.name) { set('p_name', f.name); } else if (!$('p_name').value) { $('p_name').classList.add('need'); }   /* v11: из заявки ничего не подставляется — только паспорт или рука родителя */
  set('p_doc', f.ser && f.num ? f.ser + ' ' + f.num : '');
  set('p_issuer', f.code ? ((f.how === 'МКК' || f.how === 'СӨМ') ? f.how + ' ' : '') + f.code : '');
  set('p_date', iso(f.iss)); set('p_valid', iso(f.val));
  if (f.addr) set('p_addr', f.addr);
  extraOpenIfFilled();   /* v12 */
  VERIFIED = !!(f.verified && f.verified.num && f.verified.val);
  var miss = [];
  if (SIDES.A && !$('p_name').value) miss.push('Аты-жөнү окулган жок — алдыңкы бетин жакындан кайра тартыңыз же паспорттогудай жазыңыз. / ФИО не прочиталось — переснимите лицевую сторону ближе или впишите точно как в паспорте.');
  if (!SIDES.A && (!$('p_name').value || !$('p_valid').value)) miss.push('Алдыңкы бетин тартыңыз — анда аты-жөнү жана мөөнөтү. / Снимите лицевую сторону — там ФИО и срок действия.');
  if (!SIDES.B && (!$('p_doc').value || !$('p_issuer').value)) miss.push('Арткы бетин тартыңыз — анда номери жана ким бергени. / Снимите обратную сторону — там номер и кем выдан.');
  passCheck(miss);
  ['A', 'B'].forEach(function(s) { var t = $('tile' + s); if (t && !SIDES[s]) t.classList.toggle('need', miss.length > 0); });
  liveDoc();
  return k;
}
/* срок истёк — предупреждение (не блокирует); контрольные цифры машиночитаемой строки сошлись — отметка; чего не хватает — подсказка */
function passCheck(miss) {
  var box = $('passNote'); if (!box) return; var out = '';
  var v = $('p_valid') ? $('p_valid').value : '';
  if (v && v < new Date().toISOString().slice(0, 10)) out += '<div class="warn">⚠ Паспорттун мөөнөтү өткөн (' + esc(d2(v)) + '). Жарактуу документти көрсөтүңүз. / Срок паспорта истёк — укажите действующий документ.</div>';
  else if (VERIFIED) out += '<div class="done" style="margin-top:8px">✓ Номер жана мөөнөт машиналык саптан ырасталды. / Номер и срок подтверждены по машиночитаемой строке.</div>';
  (miss || []).forEach(function(m) { out += '<div class="warn">' + esc(m) + '</div>'; });
  box.innerHTML = out;
}
document.addEventListener('input', function(e) { if (e.target && e.target.classList) { e.target.classList.remove('rec'); e.target.classList.remove('need'); } if (e.target && /^p_/.test(e.target.id || '')) liveSoon(); });
document.addEventListener('change', function(e) { if (e.target && e.target.id === 'p_valid') passCheck(); if (e.target && /^p_/.test(e.target.id || '')) liveSoon(); });
/* v12: галочка «Келишимди окудум, макулмун» → кнопка активна (подписи словом больше нет — п. 5.6: галочка + кнопка + номер + время) */
function agreeUpd() {

}
function go() {
  var e = $('err'); e.style.display = 'none';

  if (!$('sum')) { e.textContent = 'Паспортту сүрөткө тартыңыз же «колуңуз менен жазыңыз» дегенди басыңыз. / Сфотографируйте паспорт или нажмите «заполните вручную».'; e.style.display = 'block'; return; }
  var doc = $('p_doc').value.trim().replace(/\s+/g, ' ').toUpperCase(), issuer = $('p_issuer').value.trim().replace(/\s+/g, ' ');
  var d = { name: $('p_name').value.trim().replace(/\s+/g, ' '), pass: doc, iss: issuer + (d2($('p_date').value) ? (issuer ? ', ' : '') + d2($('p_date').value) : ''), val: d2($('p_valid').value), addr: $('p_addr').value.trim(), sign: '', rel: '' };
  if (d.name.length < 5) { e.textContent = ADULT ? 'Аты-жөнүңүздү жазыңыз / Напишите ваше ФИО.' : 'Ата-эненин аты-жөнүн паспорттогудай жазыңыз / Напишите ФИО родителя как в паспорте.'; e.style.display = 'block'; $('p_name').focus(); return; }
  if (!/\d{5}/.test(doc)) { e.textContent = 'Паспорттун сериясын жана номерин жазыңыз (мисалы ID 1234567) же сүрөткө тартыңыз. / Укажите серию и номер паспорта (например ID 1234567) или сфотографируйте.'; e.style.display = 'block'; $('p_doc').focus(); return; }
  var b = $('b'); b.disabled = true; b.textContent = 'Сакталууда…';
  apiPost({ op: 'accept', id: ID, t: T, name: d.name, pass: d.pass, iss: d.iss, val: d.val, addr: d.addr, sign: '', rel: d.rel, agree: '1' }).then(function(r) {   /* v13: POST — браузер не повторяет его сам */
    if (!r || !r.ok) { b.textContent = '✓ Окудум, макулмун — кол коём'; agreeUpd(); e.textContent = (r && r.error) || 'Сакталган жок, кайра басыңыз.'; e.style.display = 'block'; return; }
    if (TEST && r.test) { $('w').innerHTML = '<h1>✓ Сынак өттү / Тест пройден</h1><div class="ok">Баары иштейт. Эч нерсе сакталган жок. / Всё работает, ничего не сохранено.</div><div class="mute" style="margin-top:10px">Шилтемени кайра ачып, дагы текшерсе болот. / Ссылку можно открыть снова и проверить ещё раз.</div>' + nextKidsHtml(D); window.scrollTo(0, 0); return; }
    $('w').innerHTML = '<h1>✓ Рахмат!</h1><div class="ok">Келишим кабыл алынды · ' + esc(r.when || '') + '</div><div class="stamp">Эч нерсе жөнөтүүнүн кереги жок. Келишимдин көчүрмөсү борбордо сакталат; ошол эле шилтеме аркылуу аны каалаган убакта окуй аласыз. / Договор принят, больше ничего отправлять не нужно.</div>' + nextKidsHtml(D) + '<div class="load" id="load2">Кол коюлган келишим жүктөлүүдө… <div class="bar"><i></i></div></div>';
    window.scrollTo(0, 0);
    api({ id: ID, t: T }).then(function(d2x) { var l2 = $('load2'); if (!l2) return; if (d2x && d2x.ok && d2x.text) { l2.outerHTML = '<div class="doc full ctdoc" style="margin-top:12px">' + docHtml(d2x.text, d2x.marks) + '</div>'; } else l2.remove(); }).catch(function() { var l2 = $('load2'); if (l2) l2.remove(); });
  }).catch(function() { b.textContent = '✓ Окудум, макулмун — кол коём'; agreeUpd(); e.textContent = 'Байланыш үзүлдү, кайра басыңыз / Связь прервалась, нажмите ещё раз.'; e.style.display = 'block'; });
}
/* v13: загрузка с пределом ожидания. Первый запрос не ответил за CT_T.wait (50 с) или оборвался — второй запрос сам; через CT_T.hint (8 с)
   под полосой появляется «сервер отвечает дольше обычного» (в минуты массовой рассылки журнал занят). После двух неудач — «Повторить». */
var LOAD_N = 0;
function loadHint(txt) { var el = $('loadHint'); if (el) el.textContent = txt; }
function load() {
  if (!ID || !T) { showFail('Шилтеме толук эмес. Борбордон келишимди кайра жөнөтүүнү сураныңыз. / Ссылка неполная — попросите центр отправить договор заново.', false); return; }
  LOAD_N = 0; loadTry();
}
function loadTry() {
  LOAD_N++;
  $('w').innerHTML = '<div class="load" id="load">📄 Келишим жүктөлүүдө… / Загружаем договор…<div class="bar"><i></i></div><div class="mute" id="loadHint" style="margin-top:10px;min-height:1.2em">' + (LOAD_N > 1 ? 'Кайра суроо жөнөтүлдү… / Повторяю запрос…' : '') + '</div></div>';
  var hint = setTimeout(function() { loadHint('Сервер жай жооп берип жатат — күтө туруңуз… / Сервер отвечает дольше обычного — подождите, страница откроется…'); }, CT_T.hint);
  api({ id: ID, t: T }).then(function(d) {
    clearTimeout(hint);
    if (!d || !d.ok) { showFail((d && d.error) || 'Шилтеме жараксыз / Ссылка недействительна.', false); return; }
    if (d.phoneCentre) PHONE_CENTRE = d.phoneCentre;

    clearTimeout(hint);
    var slow = !!(err && err.name === 'AbortError');
    if (LOAD_N < 2) { loadTry(); return; }
    showFail(slow ? 'Журнал узак жооп берген жок (массалык жөнөтүү убагында ушундай болот). Бир аздан кийин «Кайра аракет кылуу» басыңыз. / Сервер долго не отвечает — так бывает в минуты массовой рассылки. Через минуту нажмите «Повторить».'
      : 'Байланыш жок — барак ачылган жок. Интернетти текшерип, кайра аракет кылыңыз. / Нет связи — страница не открылась. Проверьте интернет и повторите.', true);
  });
}
