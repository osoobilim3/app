<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планета — келишим</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#173f67">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
/* Страница договора для родителей (v4, сборка 562: скрины из «Түндүк» — несколько картинок за раз, орган СӨМ, адрес прописки, ФИО кириллицей с подсказкой;
   v3 — паспорт по фото: снимок сжимается на телефоне, журнал распознаёт текст и возвращает только данные, снимок нигде не сохраняется;
   v2 — данные паспорта из анкеты, подпись словом, вёрстка договора ctdoc.js). Оформление — как у прежней страницы в журнале.
   Данные берутся из журнала «Планета» запросом без cookies, поэтому Google-аккаунты на телефоне на страницу не влияют. */
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#e9eef5;color:#1b2333;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.w{max-width:640px;margin:auto;background:#fff;border-radius:16px;padding:18px 18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{font-size:18px;margin:0 0 4px}.sub{color:#64748b;font-size:13px;margin-bottom:12px}
label{display:block;font-size:11px;font-weight:700;color:#7b8ea6;letter-spacing:.4px;margin:10px 0 4px}
input{width:100%;border:1.5px solid #d9dee8;border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;color:#1b2333}
input:focus{outline:none;border-color:#173f67}
.box{background:#fff7ed;border:1.5px solid #fde68a;border-radius:12px;padding:10px 12px;margin:10px 0}
.doc{border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;max-height:52vh;overflow:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
.doc.full{max-height:none}
.box.sig{background:#eef6ff;border-color:#bfdbfe}
#p_sign{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:20px;color:#173f67}
.pre{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:6px 0 2px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{flex:1;min-width:70px;border:1.5px solid #d9dee8;border-radius:10px;padding:11px 6px;font-size:15px;font-weight:700;background:#fff;color:#1b2333;cursor:pointer;font-family:inherit}
.sw button.on{background:#173f67;color:#fff;border-color:#173f67}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}.hidden{display:none}
.btn{display:block;width:100%;background:#173f67;color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.55}
.ok{background:#e3f3ea;color:#15803d;border-radius:12px;padding:14px;font-weight:700;text-align:center;font-size:16px}
.err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:none}
.mute{color:#64748b;font-size:12px}
.stamp{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.load{text-align:center;padding:40px 10px;color:#64748b}
.load .bar{width:148px;height:3px;border-radius:2px;background:#e2e8f0;margin:16px auto 0;overflow:hidden}
.load .bar i{display:block;width:38%;height:100%;background:#5aa7ff;border-radius:2px;animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-105%)}100%{transform:translateX(285%)}}
.fail{background:#fff7ed;border:1.5px solid #fde68a;border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.fail a{color:#173f67;font-weight:700}
.retry{margin-top:10px;background:#fff;color:#173f67;border:1.5px solid #173f67}
/* v3: паспорт по фото */
.cam{display:flex;align-items:center;gap:10px;width:100%;border:1.5px dashed #173f67;background:#f5f9ff;color:#173f67;border-radius:12px;padding:11px 12px;font-size:14.5px;font-weight:700;font-family:inherit;text-align:left;cursor:pointer;margin-top:12px}
.cam small{display:block;font-weight:400;color:#64748b;font-size:11.5px;margin-top:2px}
.busy{background:#eef6ff;border:1.5px solid #bfdbfe;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#1e3a8a;margin-top:12px}
.busy .bar{width:100%;height:3px;border-radius:2px;background:#dbeafe;margin-top:8px;overflow:hidden}.busy .bar i{display:block;width:38%;height:100%;background:#2f7fe0;border-radius:2px;animation:slide 1.15s ease-in-out infinite}
.done{background:#ecfdf5;border:1.5px solid #a7f3d0;border-radius:12px;padding:10px 12px;font-size:13px;color:#065f46;margin-top:12px}.done a{color:#173f67;font-weight:700}
.warn{background:#fff7ed;border:1.5px solid #fdba74;border-radius:12px;padding:10px 12px;font-size:13px;color:#9a3412;margin-top:12px}
input.rec{border-color:#34d399;background:#f0fdf4}.sw button.rec{border-color:#34d399}.sw button.on.rec{box-shadow:0 0 0 2px #a7f3d0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:-9999px}
.hint{background:#eef6ff;border:1.5px solid #bfdbfe;border-radius:10px;padding:7px 10px;font-size:12.5px;color:#1e3a8a;margin-top:6px}.hint b{color:#173f67}.hint a{color:#173f67;font-weight:700}
.done label{color:#173f67;font-weight:700;text-decoration:underline;cursor:pointer}
</style>
<style id="ctdocCss"></style>
</head>
<body>
<div class="w" id="w">
  <div class="load" id="load">📄 Келишим жүктөлүүдө… / Загружаем договор…<div class="bar"><i></i></div></div>
</div>
<script>
/* ctdoc.js — общий отрисовщик договора (сборка 560). Используется в pages/dogovor.html (страница родителя) и в SearchPage.html
   (окно «Договор» в кабинете и печать). Вход: сохранённый текст договора (строки через \n) и список значений, которые надо выделить
   (данные родителя). Выход: HTML с классами .ttl .num .dt .party .d h3 p .signs .who .sg .sigline .mute .note — стили в контейнере .ctdoc. */
function ctDocHtml(text, marks) {
  var esc = function(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ms = (marks || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return v.length >= 3; }).sort(function(a, b) { return b.length - a.length; });
  var re = ms.length ? new RegExp(ms.map(function(v) { return esc(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g') : null;
  var hl = function(s) { var e = esc(s); return re ? e.replace(re, function(m) { return '<b class="d">' + m + '</b>'; }) : e; };
  var lines = String(text || '').split('\n').map(function(s) { return s.trim(); });
  var notes = []; lines = lines.filter(function(l) { if (/^\[.*\]$/.test(l)) { notes.push(l); return false; } return true; });
  var isHead = function(l) { return /^\d+\. [^a-zа-я]*$/.test(l); };
  var out = [], i = 0;
  while (i < lines.length && !lines[i]) i++;
  if (i < lines.length && !/^КЕЛИШИМ/.test(lines[i]) && !isHead(lines[i])) { out.push('<div class="ttl">' + hl(lines[i]) + '</div>'); i++; }
  if (i < lines.length && /^КЕЛИШИМ №/.test(lines[i])) { out.push('<div class="num">' + hl(lines[i]) + '</div>'); i++; }
  var sig6 = -1; for (var k = i; k < lines.length; k++) if (/^6\. /.test(lines[k]) && /РЕКВИЗИТ|КОЛ ТАМГА/.test(lines[k])) { sig6 = k; break; }
  var party = [], flush = function() { if (party.length) { out.push('<div class="party">' + party.join('') + '</div>'); party = []; } };
  for (; i < (sig6 < 0 ? lines.length : sig6); i++) {
    var l = lines[i]; if (!l) continue;
    if (/^Талас шаары/.test(l)) { flush(); var m = l.match(/^(Талас шаары)\s+(.*)$/); out.push('<div class="dt"><span>' + hl(m ? m[1] : l) + '</span><span>' + hl(m ? m[2] : '') + '</span></div>'); continue; }
    if (/^(Ата-эненин\/Мыйзамдуу өкүлдүн Аты-жөнү|Паспорт \(сериясы, номери\)|Дареги \/ Адрес|Телефон 1):/.test(l)) { party.push('<div>' + hl(l) + '</div>'); continue; }
    flush();
    out.push(isHead(l) ? '<h3>' + hl(l) + '</h3>' : '<p>' + hl(l) + '</p>');
  }
  flush();
  if (sig6 >= 0) {
    out.push('<h3>' + hl(lines[sig6]) + '</h3>');
    var left = [], right = [], side = 0;
    for (var j = sig6 + 1; j < lines.length; j++) {
      var s = lines[j]; if (!s) continue;
      if (/^АТКАРУУЧУ/.test(s)) { side = 1; right.push('<div class="who">' + hl(s.replace(/:$/, '')) + '</div>'); continue; }
      if (/^БУЮРТМАЧЫ/.test(s)) { side = 0; left.push('<div class="who">' + hl(s.replace(/:$/, '')) + '</div>'); continue; }
      if (side === 0) {
        var sm = s.match(/^Кол тамгасы:\s*(.*)$/);
        if (sm) { var v = sm[1], mm = v.match(/^«([^»]+)»\s*—\s*(.*)$/); left.push(mm ? '<div class="sg">Кол тамгасы: <span class="sigline">' + esc(mm[1]) + '</span></div><div class="mute">' + hl(mm[2]) + '</div>' : '<div class="sg">' + hl(s) + '</div>'); continue; }
        left.push('<div>' + hl(s) + '</div>');
      } else right.push('<div>' + hl(s) + '</div>');
    }
    out.push('<div class="signs"><div>' + left.join('') + '</div><div>' + right.join('') + '</div></div>');
  }
  notes.forEach(function(nn) { out.push('<p class="note">' + esc(nn) + '</p>'); });
  return out.join('');
}
var CTDOC_CSS = '.ctdoc{font-family:"Times New Roman",Times,serif;font-size:14px;line-height:1.55;color:#111}.ctdoc .ttl{text-align:center;font-weight:700;font-size:15px;margin:0 0 2px}.ctdoc .num{text-align:center;font-weight:700;margin:0 0 8px}.ctdoc .dt{display:flex;justify-content:space-between;gap:12px;color:#334155;margin:0 0 10px}.ctdoc .party{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin:8px 0}.ctdoc .party div{margin:2px 0}.ctdoc b.d{background:#fef3c7;padding:0 3px;border-radius:3px;font-weight:700}.ctdoc h3{font-size:14px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.3px}.ctdoc p{margin:0 0 5px;text-align:justify}.ctdoc .signs{display:flex;gap:14px;margin-top:12px}.ctdoc .signs>div{flex:1;min-width:0;border-top:1px solid #cbd5e1;padding-top:8px}.ctdoc .who{font-weight:700;font-size:12.5px;letter-spacing:.3px;margin-bottom:2px}.ctdoc .sg{margin-top:8px}.ctdoc .sigline{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:21px;color:#173f67;border-bottom:1.5px solid #173f67;display:inline-block;padding:0 6px 2px;min-width:120px}.ctdoc .mute{color:#64748b;font-size:12px}.ctdoc .note{color:#64748b;font-size:12px;margin-top:10px}@media (max-width:480px){.ctdoc .signs{flex-direction:column}}@media print{.ctdoc .party{border-color:#000;background:#fff}.ctdoc b.d{background:#fff}.ctdoc .sigline{color:#000;border-color:#000}}';

document.getElementById('ctdocCss').textContent = CTDOC_CSS;
/* Адрес журнала «Планета» (веб-приложение Apps Script). Запросы идут без cookies — анонимно, поэтому аккаунты Google на телефоне не мешают. */
var API = 'https://script.google.com/macros/s/AKfycby0O1aycallOk5fTZUa5L_CG432hMARssdKtmOHsJzMaqOHvFUkYrYUCQKeqyTxCW8rcQ/exec';
var Q = new URLSearchParams(location.search), ID = String(Q.get('id') || ''), T = String(Q.get('t') || '');
/* v3: &test=1 — тестовый режим (журнал разрешает его только для ссылки на номер руководителя): форма открывается и у принятого договора, ничего не сохраняется */
var TEST = Q.get('test') === '1';
var PHONE_CENTRE = '0755 494 494';
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(params) {
  if (TEST) params = Object.assign({ test: '1' }, params);
  var u = API + '?page=dogovor_api&' + new URLSearchParams(params).toString();
  return fetch(u, { method: 'GET', credentials: 'omit', redirect: 'follow', cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(t) {
    try { return JSON.parse(t); } catch (e) { throw new Error('bad json'); }
  });
}
/* v3: запрос с телом (снимок) — тоже без cookies; text/plain, чтобы браузер не делал предварительный запрос, который журнал не понимает */
function apiPost(obj) {
  if (TEST) obj = Object.assign({ test: '1' }, obj);
  var ctl = typeof AbortController === 'function' ? new AbortController() : null; if (ctl) setTimeout(function() { ctl.abort(); }, 90000);
  return fetch(API + '?page=dogovor_api', { method: 'POST', body: JSON.stringify(obj), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow', signal: ctl ? ctl.signal : undefined }).then(function(r) { return r.text(); }).then(function(t) {
    try { return JSON.parse(t); } catch (e) { throw new Error('bad json'); }
  });
}
function docHtml(text, marks) { return ctDocHtml(text, marks || []); }
/* данные паспорта из анкеты (как сохранены в заявке) → поля формы */
function parsePass(d) {
  var o = { ser: '', serOther: '', num: '', mkk: true, code: '', date: '', valid: '' };
  var p = String(d.passport || '').trim().replace(/\s+/g, ' ');
  if (p) { var m = p.match(/^([A-Za-zА-Яа-я]{1,3})\s*([0-9A-Za-z]{3,})$/); if (m) { var sr = m[1].toUpperCase(); if (['ID', 'AN', 'AC'].indexOf(sr) >= 0) o.ser = sr; else { o.ser = 'other'; o.serOther = sr; } o.num = m[2].toUpperCase(); } else { o.ser = 'other'; o.serOther = ''; o.num = p.replace(/\s/g, ''); } }
  var iss = String(d.passIssued || '').trim();
  if (iss) { var dm = iss.match(/(\d{2})\.(\d{2})\.(\d{4})/); if (dm) { o.date = dm[3] + '-' + dm[2] + '-' + dm[1]; iss = iss.replace(dm[0], '').replace(/[,\s]+$/, '').trim(); } var mk = iss.match(/^(МКК|СӨМ|СОМ)\s*(.*)$/i); if (mk) { o.mkk = /МКК/i.test(mk[1]) ? true : 'СӨМ'; o.code = mk[2].trim(); } else { o.mkk = false; o.code = iss; } }
  var vm = String(d.passValid || '').match(/(\d{2})\.(\d{2})\.(\d{4})/); if (vm) o.valid = vm[3] + '-' + vm[2] + '-' + vm[1];
  return o;
}
function prefill(d) {
  var o = parsePass(d), had = false;
  if (o.ser) { had = true; var b = o.ser === 'other' ? document.querySelector('#p_ser button:last-child') : Array.prototype.filter.call(document.querySelectorAll('#p_ser button'), function(x) { return x.textContent.trim() === o.ser; })[0]; if (b) pick(b); if (o.ser === 'other') $('p_ser_other').value = o.serOther; $('p_num').value = o.num; }
  if (o.code || o.date) { had = true; pick(o.mkk === true ? camBtn('p_iss', 'МКК') : o.mkk === 'СӨМ' ? camBtn('p_iss', 'СӨМ') : document.querySelector('#p_iss button:last-child')); $('p_code').value = o.code; }
  if (o.date) { had = true; $('p_date').value = o.date; }
  if (o.valid) { had = true; $('p_valid').value = o.valid; }
  if (had) $('pre').style.display = 'block';
}
function showFail(msg, canRetry) {
  $('w').innerHTML = '<h1>📄 Окуу келишими</h1><div class="fail">' + esc(msg) + '<br><br>Суроолор боюнча / по вопросам: WhatsApp <a href="https://wa.me/996' + PHONE_CENTRE.replace(/\D/g, '').replace(/^0/, '') + '">' + esc(PHONE_CENTRE) + '</a>.<br>Келишимге макул болсоңуз — чатка «Макул» деп жазсаңыз да болот. / Можно также ответить «Макул» в чат.</div>'
    + (canRetry ? '<button class="btn retry" onclick="load()">Кайра аракет кылуу / Повторить</button>' : '');
}
function render(d) {
  var f = function(id2, label, val, ph) { return '<label>' + label + '</label><input id="' + id2 + '" value="' + esc(val || '') + '" placeholder="' + esc(ph || '') + '" autocomplete="off">'; };
  var head = '<h1>📄 Окуу келишими · ' + esc(d.student) + '</h1><div class="sub">' + esc(d.centre || '«Планета» билим берүү борбору') + ' · ' + esc(d.date || '') + '</div>'
    + (d.test ? '<div class="warn" id="testBar" style="margin:0 0 10px">🧪 Сынак — эч нерсе сакталбайт. / Тест — ничего не сохраняется.</div>' : '');
  if (d.done) {
    $('w').innerHTML = head + '<div class="ok">✓ Келишим кабыл алынган · ' + esc(d.when || '') + '</div><div class="mute" style="margin-top:8px">Договор уже принят. Рахмат! Төмөндө — сиз макул болгон келишимдин тексти.</div><div class="doc full ctdoc">' + docHtml(d.text, d.marks) + '</div>'
      + (d.when ? '<div class="stamp"><b>Окудум, макулмун / Прочитал(а), согласен(на).</b> Электрондук түрдө кабыл алынды: ' + esc(d.when) + (d.sign ? ' · кол тамга: «' + esc(d.sign) + '»' : '') + (d.stampPhone ? ' · WhatsApp ' + esc(d.stampPhone) : '') + (d.stampParent ? ' · ' + esc(d.stampParent) : '') + '.</div>' : '');
    return;
  }
  $('w').innerHTML = head
    + '<div class="box"><b>1. Ата-эненин маалыматтары</b><div class="mute">Келишим үчүн керек. Кыргызча же орусча жазсаңыз болот.</div>'
    + f('p_name', 'АТА-ЭНЕНИН АТЫ-ЖӨНҮ / ФИО РОДИТЕЛЯ', d.parent, 'Асанова Айгуль Бакытовна')
    + '<div id="nameHint"></div><div id="cam"></div>'
    + '<label>ПАСПОРТ — СЕРИЯСЫ / СЕРИЯ</label><div class="sw" id="p_ser"><button type="button" onclick="pick(this)">ID</button><button type="button" onclick="pick(this)">AN</button><button type="button" onclick="pick(this)">AC</button><button type="button" onclick="pick(this)">Башка / Другая</button></div>'
    + '<div class="two"><div><label>НОМЕРИ / НОМЕР (только цифры)</label><input id="p_num" placeholder="1234567" inputmode="numeric" autocomplete="off" oninput="this.value=this.value.replace(/[^0-9A-Za-z]/g,\'\').toUpperCase()"></div><div id="p_ser_other_box" class="hidden"><label>СЕРИЯ</label><input id="p_ser_other" placeholder="AB" autocomplete="off" oninput="this.value=this.value.toUpperCase()"></div></div>'
    + '<label>КИМ БЕРГЕН / КЕМ ВЫДАН</label><div class="sw" id="p_iss"><button type="button" onclick="pick(this)">МКК</button><button type="button" onclick="pick(this)">СӨМ</button><button type="button" onclick="pick(this)">Башка / Другой</button></div><input id="p_code" style="margin-top:6px" placeholder="код, например 213011" autocomplete="off" oninput="this.value=this.value.toUpperCase()">'
    + '<div class="two"><div><label>КАЧАН БЕРИЛГЕН / КОГДА ВЫДАН</label><input id="p_date" type="date"></div><div><label>ЖАРАКТУУ МӨӨНӨТҮ / ДЕЙСТВИТЕЛЕН ДО</label><input id="p_valid" type="date"></div></div>'
    + f('p_addr', 'ДАРЕГИ / АДРЕС', d.addr, 'Талас ш., Манас көч., 12') + '<div class="pre" id="pre" style="display:none">✓ Паспорттун маалыматтары анкетадан алынды — текшерип чыгыңыз. / Данные паспорта подставлены из анкеты — проверьте.</div></div>'
    + '<b>2. Келишимдин тексти</b><div class="doc ctdoc">' + docHtml(d.text, d.marks) + '</div>'
    + '<div class="box sig"><b>3. Кол тамга / Подпись</b><div class="mute">Кол тамганын ордуна өз колуңуз менен жазыңыз — мисалы «Макулмун» же атыңызды. / Вместо подписи напишите своей рукой — например «Макулмун» или своё имя.</div>'
    + '<label>КОЛ ТАМГА / ПОДПИСЬ</label><input id="p_sign" placeholder="Макулмун" autocomplete="off" maxlength="60"><div class="mute" style="margin-top:6px">Жазганыңыз келишимге кол тамга катары жазылат — дата, убакыт жана WhatsApp номери менен бирге.</div></div>'
    + '<div class="err" id="err"></div><button class="btn" id="b" onclick="go()">Окудум, макулмун ✓</button><div class="mute" style="margin-top:8px;text-align:center">Прочитал(а), согласен(на). Баскычты басканда келишим кабыл алынды деп эсептелет: дата, убакыт жана номер журналга жазылат.</div>';
  prefill(d); camReset();
}
function pick(b) { var box = b.parentNode; box.querySelectorAll('button').forEach(function(x) { x.classList.toggle('on', x === b); }); if (box.id === 'p_ser') $('p_ser_other_box').classList.toggle('hidden', !/Башка/.test(b.textContent)); if (box.id === 'p_iss') $('p_code').placeholder = /МКК|СӨМ/.test(b.textContent) ? 'код, например 213011' : 'название органа / органдын аталышы'; }
function sel(id) { var b = document.querySelector('#' + id + ' button.on'); return b ? b.textContent.trim() : ''; }
function d2(v) { return v ? String(v).split('-').reverse().join('.') : ''; }
function go() {
  var ser = /Башка/.test(sel('p_ser')) ? $('p_ser_other').value.trim().toUpperCase() : sel('p_ser'), num = $('p_num').value.trim(), issSel = sel('p_iss'), code = $('p_code').value.trim().toUpperCase();
  var pass = (ser + ' ' + num).trim(), iss = ((/МКК/.test(issSel) ? 'МКК ' : /СӨМ/.test(issSel) ? 'СӨМ ' : '') + code).trim() + (d2($('p_date').value) ? ', ' + d2($('p_date').value) : '');
  var d = { name: $('p_name').value.trim(), pass: pass, iss: iss, val: d2($('p_valid').value), addr: $('p_addr').value.trim(), sign: $('p_sign').value.trim().replace(/\s+/g, ' ') }, e = $('err'); e.style.display = 'none';
  if (d.name.length < 5) { e.textContent = 'Ата-эненин аты-жөнүн жазыңыз / Напишите ФИО родителя.'; e.style.display = 'block'; return; }
  if (!ser || !num) { e.textContent = 'Паспорттун сериясын тандап, номерин жазыңыз / Выберите серию и напишите номер.'; e.style.display = 'block'; return; }
  if (d.sign.replace(/[^A-Za-zА-Яа-яЁёҢңӨөҮү]/g, '').length < 3) { e.textContent = 'Кол тамганын ордуна сөз жазыңыз — мисалы «Макулмун» же атыңызды. / Напишите подпись словом — например «Макулмун» или своё имя.'; e.style.display = 'block'; $('p_sign').focus(); return; }
  var b = $('b'); b.disabled = true; b.textContent = 'Сакталууда…';
  api({ op: 'accept', id: ID, t: T, name: d.name, pass: d.pass, iss: d.iss, val: d.val, addr: d.addr, sign: d.sign }).then(function(r) {
    if (!r || !r.ok) { b.disabled = false; b.textContent = 'Окудум, макулмун ✓'; e.textContent = (r && r.error) || 'Сакталган жок, кайра басыңыз.'; e.style.display = 'block'; return; }
    if (TEST && r.test) { $('w').innerHTML = '<h1>✓ Сынак өттү / Тест пройден</h1><div class="ok">Баары иштейт. Эч нерсе сакталган жок. / Всё работает, ничего не сохранено.</div><div class="mute" style="margin-top:10px">Шилтемени кайра ачып, дагы текшерсе болот. / Ссылку можно открыть снова и проверить ещё раз.</div>'; window.scrollTo(0, 0); return; }
    $('w').innerHTML = '<h1>✓ Рахмат!</h1><div class="ok">Келишим кабыл алынды · ' + esc(r.when || '') + '</div><div class="mute" style="margin-top:10px">Договор принят. Келишимдин көчүрмөсү борбордо сакталат; ошол эле шилтеме аркылуу аны каалаган убакта окуй аласыз.</div><div class="load" id="load2">Кол коюлган келишим жүктөлүүдө… <div class="bar"><i></i></div></div>';
    window.scrollTo(0, 0);
    api({ id: ID, t: T }).then(function(d2x) { var l2 = $('load2'); if (!l2) return; if (d2x && d2x.ok && d2x.text) { l2.outerHTML = '<div class="doc full ctdoc" style="margin-top:12px">' + docHtml(d2x.text, d2x.marks) + '</div>'; } else l2.remove(); }).catch(function() { var l2 = $('load2'); if (l2) l2.remove(); });
  }).catch(function() { b.disabled = false; b.textContent = 'Окудум, макулмун ✓'; e.textContent = 'Байланыш үзүлдү, кайра басыңыз / Связь прервалась, нажмите ещё раз.'; e.style.display = 'block'; });
}
/* v3: паспорт по фото. Снимок сжимается здесь, на телефоне, и уходит в журнал одним запросом; журнал распознаёт текст и возвращает только данные
   полей — сам снимок никуда не сохраняется (так и написано родителю). При любой ошибке поля остаются для ручного ввода. */
/* кнопка — это подпись к полю выбора файла (label): так камера/галерея открываются на iPhone надёжно, без имитации нажатия из скрипта */
var CAM_INPUT = '<input type="file" id="camfile" accept="image/*" multiple class="vh" onchange="camGot(this.files)">';
var CAM_BTN = '<label class="cam" id="camBtn" for="camfile">📷 <span>Паспорт: сүрөт же Түндүк скрини / Паспорт: фото или скрин из Тундук<small>ID-картанын арт жагын жакындан, экранга толтуруп тартыңыз же «Түндүк» тиркемесинен эки тараптын скринин тандаңыз — маалыматтар өзү толот. Сүрөт сакталбайт. / Снимите обратную сторону карты крупно, на весь экран, или выберите скрины обеих сторон из приложения «Тундук» — поля заполнятся сами. Фото не сохраняется.</small></span></label>' + CAM_INPUT;
var CAM_FAIL = 'Окуй алган жокпуз — картаны жакындан, экранга толтуруп кайра тартыңыз же колуңуз менен жазыңыз. / Не удалось прочитать — снимите карту ближе, на весь экран, или впишите вручную.';
function camReset() { var c = $('cam'); if (c) c.innerHTML = CAM_BTN; }
function camPick() { var f = $('camfile'); if (f) { f.value = ''; f.click(); } }
function camShrink(file) {
  return new Promise(function(res, rej) {
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function() { try { var w = im.naturalWidth || im.width, h = im.naturalHeight || im.height, k = Math.min(1, 2400 / Math.max(w, h, 1)); var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k)); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85)); } catch (e) { rej(e); } };
    im.onerror = function() { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}
function camGot(files) {
  var list = Array.prototype.slice.call(files || []).slice(0, 2); if (!list.length) return;   /* не больше двух картинок: обе стороны карты или скрины Түндүк */
  $('cam').innerHTML = '<div class="busy" id="camBusy">⏳ Паспортту окуп жатабыз… / Распознаём паспорт…' + (list.length > 1 ? ' (' + list.length + ')' : '') + '<div class="bar"><i></i></div></div>';
  Promise.all(list.map(camShrink)).then(function(imgs) { return apiPost({ op: 'ocr', id: ID, t: T, imgs: imgs }); }).then(function(r) {
    var dg = TEST && r && r.diag ? '<div class="mute" style="margin-top:4px">🧪 Тест: символов ' + r.diag.chars + ', строк ' + r.diag.lines + ', картинок ' + r.diag.imgs + ' (' + r.diag.kb + ' КБ), проходов ' + r.diag.passes + ', ' + Math.round(r.diag.ms / 1000) + ' с</div>' : '';
    if (!r || !r.ok) { camFail((r && r.error) || CAM_FAIL, dg); return; }
    var k = camFill(r.found || {});
    if (!k) { camFail(CAM_FAIL, dg); return; }
    var ru = k === 1 ? 'поле' : k < 5 ? 'поля' : 'полей';
    $('cam').innerHTML = '<div class="done" id="camDone">✓ Сүрөттөн ' + k + ' маалымат окулду — текшерип чыгыңыз. / Из снимка прочитано ' + k + ' ' + ru + ' — проверьте.<div class="mute" style="margin-top:4px">Сүрөт сакталган жок. / Фото не сохранено. · <label for="camfile">📷 Дагы кошуу / Добавить ещё</label></div>' + dg + '</div>' + CAM_INPUT;
    var pre = $('pre'); if (pre) pre.style.display = 'none';
  }).catch(function() { camFail('Байланыш үзүлдү — кайра аракет кылыңыз же колуңуз менен жазыңыз. / Связь прервалась — попробуйте ещё раз или впишите вручную.'); });
}
function camFail(msg, dg) { $('cam').innerHTML = '<div class="warn" id="camWarn">' + esc(msg) + (dg || '') + '</div>' + CAM_BTN; }
function camBtn(boxId, text) { return Array.prototype.filter.call(document.querySelectorAll('#' + boxId + ' button'), function(x) { return x.textContent.trim() === text; })[0]; }
function camIso(v) { var m = String(v || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
/* поля из снимка → форма; заполненное подсвечивается зелёным, пока родитель его не поправит. Возвращает, сколько полей заполнено */
function camFill(f) {
  var k = 0, mark = function(el) { if (el) el.classList.add('rec'); };
  if (f.ser && f.num) { var known = ['ID', 'AN', 'AC'].indexOf(f.ser) >= 0, b = known ? camBtn('p_ser', f.ser) : document.querySelector('#p_ser button:last-child'); if (b) { pick(b); mark(b); } if (!known) { $('p_ser_other').value = f.ser; mark($('p_ser_other')); } $('p_num').value = f.num; mark($('p_num')); k++; }
  if (f.code) { var bi = f.how === 'МКК' || f.how === 'СӨМ' ? camBtn('p_iss', f.how) : document.querySelector('#p_iss button:last-child'); if (bi) { pick(bi); mark(bi); } $('p_code').value = String(f.code).replace(/^(МКК|СӨМ)\s*/i, ''); mark($('p_code')); k++; }
  if (camIso(f.iss)) { $('p_date').value = camIso(f.iss); mark($('p_date')); k++; }
  if (camIso(f.val)) { $('p_valid').value = camIso(f.val); mark($('p_valid')); k++; }
  if (f.addr) { $('p_addr').value = f.addr; mark($('p_addr')); k++; }   /* адрес прописки из Түндүк */
  var nm = $('p_name'), cur = nm.value.trim();
  if (f.name) { if (!cur) { nm.value = f.name; mark(nm); k++; } else if (cur.replace(/\s+/g, ' ').toLowerCase() !== f.name.toLowerCase()) { $('nameHint').innerHTML = '<div class="hint" id="nameHintBox">Документте: <b>' + esc(f.name) + '</b> — <a href="#" id="nameUse">Колдонуу / Использовать</a></div>'; $('nameUse').onclick = function() { nm.value = f.name; mark(nm); $('nameHint').innerHTML = ''; return false; }; } }
  else if (f.nameLat && !cur) nm.placeholder = f.nameLat;   /* только подсказка: ФИО в договор — кириллицей, своей рукой */
  return k;
}
document.addEventListener('input', function(e) { if (e.target && e.target.classList) e.target.classList.remove('rec'); });
function load() {
  if (!ID || !T) { showFail('Шилтеме толук эмес. Борбордон келишимди кайра жөнөтүүнү сураныңыз. / Ссылка неполная — попросите центр отправить договор заново.', false); return; }
  $('w').innerHTML = '<div class="load" id="load">📄 Келишим жүктөлүүдө… / Загружаем договор…<div class="bar"><i></i></div></div>';
  api({ id: ID, t: T }).then(function(d) {
    if (!d || !d.ok) { showFail((d && d.error) || 'Шилтеме жараксыз / Ссылка недействительна.', false); return; }
    if (d.phoneCentre) PHONE_CENTRE = d.phoneCentre;
    render(d);
  }).catch(function() { showFail('Байланыш жок — барак ачылган жок. Интернетти текшерип, кайра аракет кылыңыз. / Нет связи — страница не открылась. Проверьте интернет и повторите.', true); });
}
load();
</script>
