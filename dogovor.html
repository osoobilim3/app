<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планета — келишим</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#173f67">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
/* Страница договора для родителей (v1, сборка 559). Оформление — как у прежней страницы в журнале.
   Данные берутся из журнала «Планета» запросом без cookies, поэтому Google-аккаунты на телефоне на страницу не влияют. */
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#e9eef5;color:#1b2333;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.w{max-width:640px;margin:auto;background:#fff;border-radius:16px;padding:18px 18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{font-size:18px;margin:0 0 4px}.sub{color:#64748b;font-size:13px;margin-bottom:12px}
label{display:block;font-size:11px;font-weight:700;color:#7b8ea6;letter-spacing:.4px;margin:10px 0 4px}
input{width:100%;border:1.5px solid #d9dee8;border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;color:#1b2333}
input:focus{outline:none;border-color:#173f67}
.box{background:#fff7ed;border:1.5px solid #fde68a;border-radius:12px;padding:10px 12px;margin:10px 0}
.doc{border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;max-height:52vh;overflow:auto;margin:12px 0;font-family:"Times New Roman",serif;-webkit-overflow-scrolling:touch}
.doc h3{font-size:14px;margin:10px 0 4px}.doc p{margin:0 0 6px;text-align:justify}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{flex:1;min-width:70px;border:1.5px solid #d9dee8;border-radius:10px;padding:11px 6px;font-size:15px;font-weight:700;background:#fff;color:#1b2333;cursor:pointer;font-family:inherit}
.sw button.on{background:#173f67;color:#fff;border-color:#173f67}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}.hidden{display:none}
.btn{display:block;width:100%;background:#173f67;color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.55}
.ok{background:#e3f3ea;color:#15803d;border-radius:12px;padding:14px;font-weight:700;text-align:center;font-size:16px}
.err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:none}
.mute{color:#64748b;font-size:12px}
.stamp{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.load{text-align:center;padding:40px 10px;color:#64748b}
.load .bar{width:148px;height:3px;border-radius:2px;background:#e2e8f0;margin:16px auto 0;overflow:hidden}
.load .bar i{display:block;width:38%;height:100%;background:#5aa7ff;border-radius:2px;animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-105%)}100%{transform:translateX(285%)}}
.fail{background:#fff7ed;border:1.5px solid #fde68a;border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.fail a{color:#173f67;font-weight:700}
.retry{margin-top:10px;background:#fff;color:#173f67;border:1.5px solid #173f67}
</style>
</head>
<body>
<div class="w" id="w">
  <div class="load" id="load">📄 Келишим жүктөлүүдө… / Загружаем договор…<div class="bar"><i></i></div></div>
</div>
<script>
/* Адрес журнала «Планета» (веб-приложение Apps Script). Запросы идут без cookies — анонимно, поэтому аккаунты Google на телефоне не мешают. */
var API = 'https://script.google.com/macros/s/AKfycby0O1aycallOk5fTZUa5L_CG432hMARssdKtmOHsJzMaqOHvFUkYrYUCQKeqyTxCW8rcQ/exec';
var Q = new URLSearchParams(location.search), ID = String(Q.get('id') || ''), T = String(Q.get('t') || '');
var PHONE_CENTRE = '0755 494 494';
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(params) {
  var u = API + '?page=dogovor_api&' + new URLSearchParams(params).toString();
  return fetch(u, { method: 'GET', credentials: 'omit', redirect: 'follow', cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(t) {
    try { return JSON.parse(t); } catch (e) { throw new Error('bad json'); }
  });
}
function docHtml(text) {
  return String(text || '').split('\n').map(function(s) { return s.trim(); }).filter(Boolean).map(function(ln) { return /^\d+\. [^a-zа-я]*$/.test(ln) ? '<h3>' + esc(ln) + '</h3>' : '<p>' + esc(ln) + '</p>'; }).join('');
}
function showFail(msg, canRetry) {
  $('w').innerHTML = '<h1>📄 Окуу келишими</h1><div class="fail">' + esc(msg) + '<br><br>Суроолор боюнча / по вопросам: WhatsApp <a href="https://wa.me/996' + PHONE_CENTRE.replace(/\D/g, '').replace(/^0/, '') + '">' + esc(PHONE_CENTRE) + '</a>.<br>Келишимге макул болсоңуз — чатка «Макул» деп жазсаңыз да болот. / Можно также ответить «Макул» в чат.</div>'
    + (canRetry ? '<button class="btn retry" onclick="load()">Кайра аракет кылуу / Повторить</button>' : '');
}
function render(d) {
  var f = function(id2, label, val, ph) { return '<label>' + label + '</label><input id="' + id2 + '" value="' + esc(val || '') + '" placeholder="' + esc(ph || '') + '" autocomplete="off">'; };
  var head = '<h1>📄 Окуу келишими · ' + esc(d.student) + '</h1><div class="sub">' + esc(d.centre || '«Планета» билим берүү борбору') + ' · ' + esc(d.date || '') + '</div>';
  if (d.done) {
    $('w').innerHTML = head + '<div class="ok">✓ Келишим кабыл алынган · ' + esc(d.when || '') + '</div><div class="mute" style="margin-top:8px">Договор уже принят. Рахмат! Төмөндө — сиз макул болгон келишимдин тексти.</div><div class="doc">' + docHtml(d.text) + '</div>'
      + (d.when ? '<div class="stamp"><b>Окудум, макулмун / Прочитал(а), согласен(на).</b> Электрондук түрдө кабыл алынды: ' + esc(d.when) + (d.stampPhone ? ', WhatsApp ' + esc(d.stampPhone) : '') + (d.stampParent ? ', ' + esc(d.stampParent) : '') + '.</div>' : '');
    return;
  }
  $('w').innerHTML = head
    + '<div class="box"><b>1. Ата-эненин маалыматтары</b><div class="mute">Келишим үчүн керек. Кыргызча же орусча жазсаңыз болот.</div>'
    + f('p_name', 'АТА-ЭНЕНИН АТЫ-ЖӨНҮ / ФИО РОДИТЕЛЯ', d.parent, 'Асанова Айгуль Бакытовна')
    + '<label>ПАСПОРТ — СЕРИЯСЫ / СЕРИЯ</label><div class="sw" id="p_ser"><button type="button" onclick="pick(this)">ID</button><button type="button" onclick="pick(this)">AN</button><button type="button" onclick="pick(this)">AC</button><button type="button" onclick="pick(this)">Башка / Другая</button></div>'
    + '<div class="two"><div><label>НОМЕРИ / НОМЕР (только цифры)</label><input id="p_num" placeholder="1234567" inputmode="numeric" autocomplete="off" oninput="this.value=this.value.replace(/[^0-9A-Za-z]/g,\'\').toUpperCase()"></div><div id="p_ser_other_box" class="hidden"><label>СЕРИЯ</label><input id="p_ser_other" placeholder="AB" autocomplete="off" oninput="this.value=this.value.toUpperCase()"></div></div>'
    + '<label>КИМ БЕРГЕН / КЕМ ВЫДАН</label><div class="two"><div style="flex:.6"><div class="sw" id="p_iss"><button type="button" onclick="pick(this)">МКК</button><button type="button" onclick="pick(this)">Башка / Другой</button></div></div><div><input id="p_code" placeholder="код, например 213011" inputmode="numeric" autocomplete="off" oninput="this.value=this.value.toUpperCase()"></div></div>'
    + '<div class="two"><div><label>КАЧАН БЕРИЛГЕН / КОГДА ВЫДАН</label><input id="p_date" type="date"></div><div><label>ЖАРАКТУУ МӨӨНӨТҮ / ДЕЙСТВИТЕЛЕН ДО</label><input id="p_valid" type="date"></div></div>'
    + f('p_addr', 'ДАРЕГИ / АДРЕС', d.addr, 'Талас ш., Манас көч., 12') + '</div>'
    + '<b>2. Келишимдин тексти</b><div class="doc">' + docHtml(d.text) + '</div>'
    + '<div class="err" id="err"></div><button class="btn" id="b" onclick="go()">Окудум, макулмун ✓</button><div class="mute" style="margin-top:8px;text-align:center">Прочитал(а), согласен(на). Баскычты басканда келишим кабыл алынды деп эсептелет: дата, убакыт жана номер журналга жазылат.</div>';
}
function pick(b) { var box = b.parentNode; box.querySelectorAll('button').forEach(function(x) { x.classList.toggle('on', x === b); }); if (box.id === 'p_ser') $('p_ser_other_box').classList.toggle('hidden', !/Башка/.test(b.textContent)); if (box.id === 'p_iss') $('p_code').placeholder = /МКК/.test(b.textContent) ? 'код, например 213011' : 'название органа / органдын аталышы'; }
function sel(id) { var b = document.querySelector('#' + id + ' button.on'); return b ? b.textContent.trim() : ''; }
function d2(v) { return v ? String(v).split('-').reverse().join('.') : ''; }
function go() {
  var ser = /Башка/.test(sel('p_ser')) ? $('p_ser_other').value.trim().toUpperCase() : sel('p_ser'), num = $('p_num').value.trim(), issSel = sel('p_iss'), code = $('p_code').value.trim().toUpperCase();
  var pass = (ser + ' ' + num).trim(), iss = ((/МКК/.test(issSel) ? 'МКК ' : '') + code).trim() + (d2($('p_date').value) ? ', ' + d2($('p_date').value) : '');
  var d = { name: $('p_name').value.trim(), pass: pass, iss: iss, val: d2($('p_valid').value), addr: $('p_addr').value.trim() }, e = $('err'); e.style.display = 'none';
  if (d.name.length < 5) { e.textContent = 'Ата-эненин аты-жөнүн жазыңыз / Напишите ФИО родителя.'; e.style.display = 'block'; return; }
  if (!ser || !num) { e.textContent = 'Паспорттун сериясын тандап, номерин жазыңыз / Выберите серию и напишите номер.'; e.style.display = 'block'; return; }
  var b = $('b'); b.disabled = true; b.textContent = 'Сакталууда…';
  api({ op: 'accept', id: ID, t: T, name: d.name, pass: d.pass, iss: d.iss, val: d.val, addr: d.addr }).then(function(r) {
    if (!r || !r.ok) { b.disabled = false; b.textContent = 'Окудум, макулмун ✓'; e.textContent = (r && r.error) || 'Сакталган жок, кайра басыңыз.'; e.style.display = 'block'; return; }
    $('w').innerHTML = '<h1>✓ Рахмат!</h1><div class="ok">Келишим кабыл алынды · ' + esc(r.when || '') + '</div><div class="mute" style="margin-top:10px">Договор принят. Келишимдин көчүрмөсү борбордо сакталат; ошол эле шилтеме аркылуу аны каалаган убакта окуй аласыз.</div>';
    window.scrollTo(0, 0);
  }).catch(function() { b.disabled = false; b.textContent = 'Окудум, макулмун ✓'; e.textContent = 'Байланыш үзүлдү, кайра басыңыз / Связь прервалась, нажмите ещё раз.'; e.style.display = 'block'; });
}
function load() {
  if (!ID || !T) { showFail('Шилтеме толук эмес. Борбордон келишимди кайра жөнөтүүнү сураныңыз. / Ссылка неполная — попросите центр отправить договор заново.', false); return; }
  $('w').innerHTML = '<div class="load" id="load">📄 Келишим жүктөлүүдө… / Загружаем договор…<div class="bar"><i></i></div></div>';
  api({ id: ID, t: T }).then(function(d) {
    if (!d || !d.ok) { showFail((d && d.error) || 'Шилтеме жараксыз / Ссылка недействительна.', false); return; }
    if (d.phoneCentre) PHONE_CENTRE = d.phoneCentre;
    render(d);
  }).catch(function() { showFail('Байланыш жок — барак ачылган жок. Интернетти текшерип, кайра аракет кылыңыз. / Нет связи — страница не открылась. Проверьте интернет и повторите.', true); });
}
load();
</script>
</body>
</html>
