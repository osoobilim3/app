<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планета — келишим</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#173f67">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<style>
/* Страница договора для родителей (v9, сборка 571: в сообщении об ошибке нет строки «можно ответить «Макул» в чат» — договор подписывается только на странице; v8, сборка 570: номер и код из ссылки берутся без приклеенного хвоста — ссылка, вставленная в WhatsApp дважды подряд или без пробела перед текстом, открывается; v7, сборка 565: текст договора на странице заполняется введённым сразу (бланк tpl с полями родителя); ФИО из анкеты
   убирается, если пол по паспорту ему не соответствует; v6, сборка 564: паспорт по двум сторонам — две плитки «лицевая / обратная», данные считываются сами после второго снимка,
   карточка «По паспорту» с правкой строк, мама/папа по полу из паспорта, ручной ввод под ссылкой; убраны кнопки ID/AN/AC, МКК/СӨМ и вопрос «кто заполняет»;
   v5, сборка 563: «кто заполняет» (мама / папа / представитель) — договор с тем, кто подписал; ученик 18+ — свои данные,
   договор с ним самим; предупреждение о просроченном паспорте; «данные подтверждены по машиночитаемой строке» после снимка; v4, сборка 562: скрины из «Түндүк» — несколько картинок за раз, орган СӨМ, адрес прописки, ФИО кириллицей с подсказкой;
   v3 — паспорт по фото: снимок сжимается на телефоне, журнал распознаёт текст и возвращает только данные, снимок нигде не сохраняется;
   v2 — данные паспорта из анкеты, подпись словом, вёрстка договора ctdoc.js). Оформление — как у прежней страницы в журнале.
   Данные берутся из журнала «Планета» запросом без cookies, поэтому Google-аккаунты на телефоне на страницу не влияют. */
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:#e9eef5;color:#1b2333;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.w{max-width:640px;margin:auto;background:#fff;border-radius:16px;padding:18px 18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
h1{font-size:18px;margin:0 0 4px}.sub{color:#64748b;font-size:13px;margin-bottom:12px}
label{display:block;font-size:11px;font-weight:700;color:#7b8ea6;letter-spacing:.4px;margin:10px 0 4px}
input{width:100%;border:1.5px solid #d9dee8;border-radius:10px;padding:11px 12px;font-size:16px;font-family:inherit;background:#fff;color:#1b2333}
input:focus{outline:none;border-color:#173f67}
.box{background:#fff7ed;border:1.5px solid #fde68a;border-radius:12px;padding:10px 12px;margin:10px 0}
.doc{border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;max-height:52vh;overflow:auto;margin:12px 0;-webkit-overflow-scrolling:touch}
.doc.full{max-height:none}
.box.sig{background:#eef6ff;border-color:#bfdbfe}
#p_sign{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:20px;color:#173f67}
.pre{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:8px 10px;font-size:12.5px;margin:6px 0 2px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{flex:1;min-width:70px;border:1.5px solid #d9dee8;border-radius:10px;padding:11px 6px;font-size:15px;font-weight:700;background:#fff;color:#1b2333;cursor:pointer;font-family:inherit}
.sw button.on{background:#173f67;color:#fff;border-color:#173f67}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}.hidden{display:none}
.btn{display:block;width:100%;background:#173f67;color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.55}
.ok{background:#e3f3ea;color:#15803d;border-radius:12px;padding:14px;font-weight:700;text-align:center;font-size:16px}
.err{background:#fee2e2;color:#991b1b;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px;display:none}
.mute{color:#64748b;font-size:12px}
.stamp{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:8px 10px;font-size:13px;margin-top:10px}
.load{text-align:center;padding:40px 10px;color:#64748b}
.load .bar{width:148px;height:3px;border-radius:2px;background:#e2e8f0;margin:16px auto 0;overflow:hidden}
.load .bar i{display:block;width:38%;height:100%;background:#5aa7ff;border-radius:2px;animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-105%)}100%{transform:translateX(285%)}}
.fail{background:#fff7ed;border:1.5px solid #fde68a;border-radius:12px;padding:14px;font-size:14px;line-height:1.5}
.fail a{color:#173f67;font-weight:700}
.retry{margin-top:10px;background:#fff;color:#173f67;border:1.5px solid #173f67}
/* v3: паспорт по фото */
.cam{display:flex;align-items:center;gap:10px;width:100%;border:1.5px dashed #173f67;background:#f5f9ff;color:#173f67;border-radius:12px;padding:11px 12px;font-size:14.5px;font-weight:700;font-family:inherit;text-align:left;cursor:pointer;margin-top:12px}
.cam small{display:block;font-weight:400;color:#64748b;font-size:11.5px;margin-top:2px}
.busy{background:#eef6ff;border:1.5px solid #bfdbfe;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#1e3a8a;margin-top:12px}
.busy .bar{width:100%;height:3px;border-radius:2px;background:#dbeafe;margin-top:8px;overflow:hidden}.busy .bar i{display:block;width:38%;height:100%;background:#2f7fe0;border-radius:2px;animation:slide 1.15s ease-in-out infinite}
.done{background:#ecfdf5;border:1.5px solid #a7f3d0;border-radius:12px;padding:10px 12px;font-size:13px;color:#065f46;margin-top:12px}.done a{color:#173f67;font-weight:700}
.warn{background:#fff7ed;border:1.5px solid #fdba74;border-radius:12px;padding:10px 12px;font-size:13px;color:#9a3412;margin-top:12px}
input.rec{border-color:#34d399;background:#f0fdf4}.sw button.rec{border-color:#34d399}.sw button.on.rec{box-shadow:0 0 0 2px #a7f3d0}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:-9999px}
.note2{color:#64748b;font-size:12px;margin-top:6px}
.hint{background:#eef6ff;border:1.5px solid #bfdbfe;border-radius:10px;padding:7px 10px;font-size:12.5px;color:#1e3a8a;margin-top:6px}.hint b{color:#173f67}.hint a{color:#173f67;font-weight:700}
.done label{color:#173f67;font-weight:700;text-decoration:underline;cursor:pointer}
/* v6: две стороны паспорта */
.tiles{display:flex;gap:10px;margin-top:10px}
.tile{flex:1;border:1.5px dashed #173f67;background:#f5f9ff;border-radius:12px;padding:12px 8px;text-align:center;color:#173f67;font-weight:700;font-size:13.5px;min-height:96px;display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer;background-size:cover;background-position:center;position:relative;overflow:hidden}
.tile small{display:block;font-weight:400;color:#64748b;font-size:11px}
.tile.done{border-style:solid;border-color:#34d399;background-color:#f0fdf4;color:#065f46}
.tile.done .lab{background:rgba(240,253,244,.9);border-radius:8px;padding:4px 6px}
.tile.need{border-color:#fdba74;background-color:#fff7ed;color:#9a3412}
.big{display:block;width:100%;background:#173f67;color:#fff;border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;margin-top:10px;font-family:inherit;cursor:pointer}
.big:disabled{background:#cbd5e1;cursor:default}
.sum{background:#f0fdf4;border:1.5px solid #a7f3d0;border-radius:12px;padding:10px 12px;margin-top:10px}
.sum.manual{background:#fff;border-color:#d9dee8}
.sum h4{margin:0 0 6px;font-size:13.5px;color:#065f46}.sum.manual h4{color:#1b2333}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #d1fae5}.sum.manual .kv{border-color:#eef2f7}.kv:last-of-type{border:0}
.kv span{color:#64748b;font-size:12px;flex:0 0 42%}
.kv input{flex:1;text-align:right;border:1.5px solid transparent;background:transparent;font-weight:700;font-size:14px;padding:6px 6px;border-radius:8px;color:#1b2333}
.kv input:focus{border-color:#173f67;background:#fff;outline:none}
.kv input.rec{background:#dcfce7}
.kv input.need{background:#ffedd5;border-color:#fdba74}
.sum.manual .kv input{border-color:#d9dee8;background:#fff;text-align:left;font-weight:400}
.kv.col{flex-direction:column;align-items:stretch;gap:2px}.kv.col span{flex:none}.kv.col input{text-align:left}
.relrow{font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #d1fae5}.relrow span{color:#64748b;font-size:12px}
.lnk{color:#173f67;font-weight:700;text-decoration:underline;cursor:pointer;font-size:12.5px;background:none;border:0;font-family:inherit;padding:0}
</style>
<style id="ctdocCss"></style>
</head>
<body>
<div class="w" id="w">
  <div class="load" id="load">📄 Келишим жүктөлүүдө… / Загружаем договор…<div class="bar"><i></i></div></div>
</div>
<script>
/* ctdoc.js — общий отрисовщик договора (сборка 560). Используется в pages/dogovor.html (страница родителя) и в SearchPage.html
   (окно «Договор» в кабинете и печать). Вход: сохранённый текст договора (строки через \n) и список значений, которые надо выделить
   (данные родителя). Выход: HTML с классами .ttl .num .dt .party .d h3 p .signs .who .sg .sigline .mute .note — стили в контейнере .ctdoc. */
function ctDocHtml(text, marks) {
  var esc = function(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var ms = (marks || []).map(function(v) { return String(v || '').trim(); }).filter(function(v) { return v.length >= 3; }).sort(function(a, b) { return b.length - a.length; });
  var re = ms.length ? new RegExp(ms.map(function(v) { return esc(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g') : null;
  var hl = function(s) { var e = esc(s); return re ? e.replace(re, function(m) { return '<b class="d">' + m + '</b>'; }) : e; };
  var lines = String(text || '').split('\n').map(function(s) { return s.trim(); });
  var notes = []; lines = lines.filter(function(l) { if (/^\[.*\]$/.test(l)) { notes.push(l); return false; } return true; });
  var isHead = function(l) { return /^\d+\. [^a-zа-я]*$/.test(l); };
  var out = [], i = 0;
  while (i < lines.length && !lines[i]) i++;
  if (i < lines.length && !/^КЕЛИШИМ/.test(lines[i]) && !isHead(lines[i])) { out.push('<div class="ttl">' + hl(lines[i]) + '</div>'); i++; }
  if (i < lines.length && /^КЕЛИШИМ №/.test(lines[i])) { out.push('<div class="num">' + hl(lines[i]) + '</div>'); i++; }
  var sig6 = -1; for (var k = i; k < lines.length; k++) if (/^6\. /.test(lines[k]) && /РЕКВИЗИТ|КОЛ ТАМГА/.test(lines[k])) { sig6 = k; break; }
  var party = [], flush = function() { if (party.length) { out.push('<div class="party">' + party.join('') + '</div>'); party = []; } };
  for (; i < (sig6 < 0 ? lines.length : sig6); i++) {
    var l = lines[i]; if (!l) continue;
    if (/^Талас шаары/.test(l)) { flush(); var m = l.match(/^(Талас шаары)\s+(.*)$/); out.push('<div class="dt"><span>' + hl(m ? m[1] : l) + '</span><span>' + hl(m ? m[2] : '') + '</span></div>'); continue; }
    if (/^(Ата-эненин\/Мыйзамдуу өкүлдүн Аты-жөнү|Паспорт \(сериясы, номери\)|Дареги \/ Адрес|Телефон 1):/.test(l)) { party.push('<div>' + hl(l) + '</div>'); continue; }
    flush();
    out.push(isHead(l) ? '<h3>' + hl(l) + '</h3>' : '<p>' + hl(l) + '</p>');
  }
  flush();
  if (sig6 >= 0) {
    out.push('<h3>' + hl(lines[sig6]) + '</h3>');
    var left = [], right = [], side = 0;
    for (var j = sig6 + 1; j < lines.length; j++) {
      var s = lines[j]; if (!s) continue;
      if (/^АТКАРУУЧУ/.test(s)) { side = 1; right.push('<div class="who">' + hl(s.replace(/:$/, '')) + '</div>'); continue; }
      if (/^БУЮРТМАЧЫ/.test(s)) { side = 0; left.push('<div class="who">' + hl(s.replace(/:$/, '')) + '</div>'); continue; }
      if (side === 0) {
        var sm = s.match(/^Кол тамгасы:\s*(.*)$/);
        if (sm) { var v = sm[1], mm = v.match(/^«([^»]+)»\s*—\s*(.*)$/); left.push(mm ? '<div class="sg">Кол тамгасы: <span class="sigline">' + esc(mm[1]) + '</span></div><div class="mute">' + hl(mm[2]) + '</div>' : '<div class="sg">' + hl(s) + '</div>'); continue; }
        left.push('<div>' + hl(s) + '</div>');
      } else right.push('<div>' + hl(s) + '</div>');
    }
    out.push('<div class="signs"><div>' + left.join('') + '</div><div>' + right.join('') + '</div></div>');
  }
  notes.forEach(function(nn) { out.push('<p class="note">' + esc(nn) + '</p>'); });
  return out.join('');
}
var CTDOC_CSS = '.ctdoc{font-family:"Times New Roman",Times,serif;font-size:14px;line-height:1.55;color:#111}.ctdoc .ttl{text-align:center;font-weight:700;font-size:15px;margin:0 0 2px}.ctdoc .num{text-align:center;font-weight:700;margin:0 0 8px}.ctdoc .dt{display:flex;justify-content:space-between;gap:12px;color:#334155;margin:0 0 10px}.ctdoc .party{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin:8px 0}.ctdoc .party div{margin:2px 0}.ctdoc b.d{background:#fef3c7;padding:0 3px;border-radius:3px;font-weight:700}.ctdoc h3{font-size:14px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.3px}.ctdoc p{margin:0 0 5px;text-align:justify}.ctdoc .signs{display:flex;gap:14px;margin-top:12px}.ctdoc .signs>div{flex:1;min-width:0;border-top:1px solid #cbd5e1;padding-top:8px}.ctdoc .who{font-weight:700;font-size:12.5px;letter-spacing:.3px;margin-bottom:2px}.ctdoc .sg{margin-top:8px}.ctdoc .sigline{font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;font-size:21px;color:#173f67;border-bottom:1.5px solid #173f67;display:inline-block;padding:0 6px 2px;min-width:120px}.ctdoc .mute{color:#64748b;font-size:12px}.ctdoc .note{color:#64748b;font-size:12px;margin-top:10px}@media (max-width:480px){.ctdoc .signs{flex-direction:column}}@media print{.ctdoc .party{border-color:#000;background:#fff}.ctdoc b.d{background:#fff}.ctdoc .sigline{color:#000;border-color:#000}}';

document.getElementById('ctdocCss').textContent = CTDOC_CSS;
/* Адрес журнала «Планета» (веб-приложение Apps Script). Запросы идут без cookies — анонимно, поэтому аккаунты Google на телефоне не мешают. */
var API = 'https://script.google.com/macros/s/AKfycby0O1aycallOk5fTZUa5L_CG432hMARssdKtmOHsJzMaqOHvFUkYrYUCQKeqyTxCW8rcQ/exec';
var Q = new URLSearchParams(location.search);
/* v8 (сборка 570): «склеенные» ссылки — WhatsApp приклеивает к адресу вторую ссылку или текст без пробела, и код приходил с хвостом
   («t=…779217bhttps://…») → «Шилтеме жараксыз». Берём только сам номер (цифры, u…, z…, З-…, ЗВ-…, У-…) и первые 16 знаков кода. */
var ID = (String(Q.get('id') || '').trim().match(/^[A-Za-zА-Яа-я]{0,2}-?\d+/) || [''])[0];
var T = (String(Q.get('t') || '').trim().match(/^[0-9a-f]{16}/i) || [''])[0].toLowerCase();
/* &test=1 — тестовый режим (журнал разрешает его только для ссылки на номер руководителя): форма открывается и у принятого договора, ничего не сохраняется */
var TEST = Q.get('test') === '1';
var D = null, ADULT = false;
var PHONE_CENTRE = '0755 494 494';
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function api(params) {
  if (TEST) params = Object.assign({ test: '1' }, params);
  var u = API + '?page=dogovor_api&' + new URLSearchParams(params).toString();
  return fetch(u, { method: 'GET', credentials: 'omit', redirect: 'follow', cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(t) {
    try { return JSON.parse(t); } catch (e) { throw new Error('bad json'); }
  });
}
/* запрос с телом (снимки) — тоже без cookies; text/plain, чтобы браузер не делал предварительный запрос, который журнал не понимает */
function apiPost(obj) {
  if (TEST) obj = Object.assign({ test: '1' }, obj);
  var ctl = typeof AbortController === 'function' ? new AbortController() : null; if (ctl) setTimeout(function() { ctl.abort(); }, 90000);
  return fetch(API + '?page=dogovor_api', { method: 'POST', body: JSON.stringify(obj), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow', signal: ctl ? ctl.signal : undefined }).then(function(r) { return r.text(); }).then(function(t) {
    try { return JSON.parse(t); } catch (e) { throw new Error('bad json'); }
  });
}
function docHtml(text, marks) { return ctDocHtml(text, marks || []); }
function d2(v) { return v ? String(v).split('-').reverse().join('.') : ''; }
function iso(v) { var m = String(v || '').match(/^(\d{2})\.(\d{2})\.(\d{4})$/); return m ? m[3] + '-' + m[2] + '-' + m[1] : ''; }
/* данные паспорта из анкеты («ID 1234567», «СӨМ 213011, 25.10.2023», «25.10.2033») → поля */
function anketaPass(d) {
  var o = { doc: String(d.passport || '').trim().replace(/\s+/g, ' '), issuer: '', date: '', valid: iso(String(d.passValid || '').match(/\d{2}\.\d{2}\.\d{4}/) ? String(d.passValid).match(/\d{2}\.\d{2}\.\d{4}/)[0] : '') };
  var iss = String(d.passIssued || '').trim(); var dm = iss.match(/(\d{2})\.(\d{2})\.(\d{4})/); if (dm) { o.date = dm[3] + '-' + dm[2] + '-' + dm[1]; iss = iss.replace(dm[0], '').replace(/[,\s]+$/, '').trim(); }
  o.issuer = iss; return o;
}
function showFail(msg, canRetry) {
  $('w').innerHTML = '<h1>📄 Окуу келишими</h1><div class="fail">' + esc(msg) + '<br><br>Суроолор боюнча / по вопросам: WhatsApp <a href="https://wa.me/996' + PHONE_CENTRE.replace(/\D/g, '').replace(/^0/, '') + '">' + esc(PHONE_CENTRE) + '</a>.</div>'
    + (canRetry ? '<button class="btn retry" onclick="load()">Кайра аракет кылуу / Повторить</button>' : '');
}
/* v6: кем приходится — определяется по полу из паспорта; «изменить» — для бабушки, опекуна */
var REL = '', REL_FROM = '';
var REL_T = { 'мама': 'Апасы / Мама', 'папа': 'Атасы / Папа', 'представитель': 'Башка өкүл / Представитель' };
function relRow() {
  if (ADULT) return '';
  var v = REL ? REL_T[REL] : '<i style="color:#9a3412;font-style:normal">аныктала элек / не определено</i>';
  return '<div class="relrow" id="relRow"><span>Окуучуга ким болот / Кем приходится</span><b>' + v + (REL_FROM === 'паспорт' ? ' <span style="font-weight:400">· по паспорту</span>' : '') + ' <button type="button" class="lnk" onclick="relEdit()">изменить</button></b></div>';
}
function relEdit() {
  var row = $('relRow'); if (!row) return;

    $('w').innerHTML = '<h1>✓ Рахмат!</h1><div class="ok">Келишим кабыл алынды · ' + esc(r.when || '') + '</div><div class="mute" style="margin-top:10px">Договор принят. Келишимдин көчүрмөсү борбордо сакталат; ошол эле шилтеме аркылуу аны каалаган убакта окуй аласыз.</div><div class="load" id="load2">Кол коюлган келишим жүктөлүүдө… <div class="bar"><i></i></div></div>';
    window.scrollTo(0, 0);
    api({ id: ID, t: T }).then(function(d2x) { var l2 = $('load2'); if (!l2) return; if (d2x && d2x.ok && d2x.text) { l2.outerHTML = '<div class="doc full ctdoc" style="margin-top:12px">' + docHtml(d2x.text, d2x.marks) + '</div>'; } else l2.remove(); }).catch(function() { var l2 = $('load2'); if (l2) l2.remove(); });
  }).catch(function() { b.disabled = false; b.textContent = 'Окудум, макулмун ✓'; e.textContent = 'Байланыш үзүлдү, кайра басыңыз / Связь прервалась, нажмите ещё раз.'; e.style.display = 'block'; });
}
function load() {

  api({ id: ID, t: T }).then(function(d) {

    if (d.phoneCentre) PHONE_CENTRE = d.phoneCentre;
